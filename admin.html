<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Naija Life — Admin</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#07110d;
  --panel:#0c1b15;
  --panel2:#10231b;
  --line:#1d3d30;
  --text:#f4f8f6;
  --muted:#8fa79c;
  --green:#22c77d;
  --red:#ef6262;
  --orange:#e6ad35;
  --blue:#4c91ff;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:white;
}

svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:240px;
  background:#081710;
  border-right:1px solid var(--line);
  padding:20px 14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 8px 25px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#18a968;
  display:grid;
  place-items:center;
}

.logo svg{
  color:white;
}

.brand strong{
  display:block;
}

.brand span{
  color:#6f877d;
  font-size:9px;
  letter-spacing:1.5px;
}

.nav-title{
  color:#536b61;
  font-size:10px;
  margin:15px 10px 8px;
  text-transform:uppercase;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  color:#8ea69a;
  border-radius:10px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
}

.nav button.active,
.nav button:hover{
  background:#102b20;
  color:#6ff0ae;
}

.main{
  margin-left:240px;
}

.topbar{
  height:70px;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(7,17,13,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 25px;
}

.topbar h1{
  margin:0;
  font-size:20px;
}

.topbar p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:39px;
  height:39px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b1c15;
  color:#91a89e;
  display:grid;
  place-items:center;
}

.content{
  max-width:1450px;
  margin:auto;
  padding:24px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  background:#0d291e;
  border:1px solid #1d4a36;
  color:#74e9ae;
  border-radius:11px;
  padding:11px;
  font-size:12px;
  margin-bottom:18px;
}

.status.error{
  background:#351717;
  color:#ff9b9b;
  border-color:#552525;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
  margin-bottom:18px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
}

.stat-icon{
  width:37px;
  height:37px;
  border-radius:10px;
  background:#123024;
  color:#5de7a2;
  display:grid;
  place-items:center;
}

.stat-label{
  margin-top:12px;
  color:#789087;
  font-size:10px;
}

.stat-value{
  margin-top:4px;
  font-size:22px;
  font-weight:bold;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.panel-head{
  padding:17px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.panel-title{
  display:flex;
  gap:10px;
  align-items:center;
}

.panel-title svg{
  color:#55df99;
}

.panel-title h2{
  margin:0;
  font-size:15px;
}

.panel-title p{
  margin:3px 0 0;
  color:#71887e;
  font-size:10px;
}

.controls{
  display:flex;
  gap:8px;
}

.search{
  width:250px;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#07150f;
  color:white;
  outline:none;
}

.select{
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#07150f;
  color:white;
}

.players{
  padding:9px;
}

.player{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:12px;
  align-items:center;
  padding:13px;
  border-bottom:1px solid #142b22;
}

.player:hover{
  background:#0d2118;
}

.player-main{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#153a2a;
  color:#68e8a6;
  display:grid;
  place-items:center;
  flex:none;
}

.name{
  font-size:13px;
  font-weight:bold;
}

.sub{
  color:#718a7f;
  font-size:9px;
  margin-top:3px;
}

.label{
  color:#668076;
  font-size:9px;
  text-transform:uppercase;
}

.value{
  margin-top:4px;
  font-size:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:5px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:bold;
}

.active{
  background:#113522;
  color:#6be8a7;
}

.banned{
  background:#401919;
  color:#ff9999;
}

.arrested{
  background:#422c10;
  color:#ffc95d;
}

.actions{
  display:flex;
  gap:5px;
  justify-content:flex-end;
}

.action{
  width:35px;
  height:35px;
  border:1px solid var(--line);
  background:#091811;
  color:#91a89e;
  border-radius:9px;
  display:grid;
  place-items:center;
}

.action.money:hover{
  color:#6be8a7;
}

.action.arrest:hover{
  color:#ffc95d;
}

.action.release:hover{
  color:#6be8a7;
}

.action.ban:hover{
  color:#ff9999;
}

.empty{
  padding:40px;
  text-align:center;
  color:#71887d;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:410px;
  background:#0c2118;
  border:1px solid #285440;
  border-radius:18px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h2{
  margin:0;
  font-size:17px;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:9px;
  background:#142a21;
  color:#9ab0a6;
}

.modal p{
  color:#8fa79c;
  font-size:12px;
}

label{
  display:block;
  color:#8fa79c;
  font-size:10px;
  margin:12px 0 6px;
}

.input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#07140e;
  color:white;
  outline:none;
}

.primary{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  margin-top:15px;
  background:#18ad68;
  color:white;
  font-weight:bold;
}

.warning{
  background:#c58b1e;
  color:#111;
}

@media(max-width:900px){

  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
    z-index:50;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .player{
    grid-template-columns:1fr;
    border:1px solid #163328;
    border-radius:13px;
    margin-bottom:8px;
  }

  .panel-head{
    flex-direction:column;
    align-items:stretch;
  }

  .controls{
    width:100%;
  }

  .search{
    width:100%;
  }

}

@media(max-width:520px){

  .content{
    padding:13px;
  }

  .topbar{
    padding:0 13px;
  }

  .stats{
    gap:8px;
  }

  .stat{
    padding:12px;
  }

}

</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

</aside>


<section class="main">

  <div style="display:flex;gap:10px;align-items:center;">

         id="playersPanel">

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


import {
  getFunctions,
  httpsCallable
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";


const firebaseConfig={

apiKey:
"AIzaSyBFXbsI4y4f7QepfK3NFrP3LBsIFAWAhEE",

authDomain:
"game-97f37.firebaseapp.com",

projectId:
"game-97f37",

storageBucket:
"game-97f37.firebasestorage.app",

messagingSenderId:
"584626250832",

appId:
"1:584626250832:web:57f076e095174ccd74dd55",

databaseURL:
"https://game-97f37-default-rtdb.firebaseio.com"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const functions =
getFunctions(app);


const playersEl =
document.getElementById("players");

const search =
document.getElementById("search");

const filter =
document.getElementById("filter");

const totalPlayers =
document.getElementById("totalPlayers");

const activePlayers =
document.getElementById("activePlayers");

const bannedPlayers =
document.getElementById("bannedPlayers");

const arrestedPlayers =
document.getElementById("arrestedPlayers");

const status =
document.getElementById("status");

const arrestModal =
document.getElementById("arrestModal");

const arrestPlayerName =
document.getElementById("arrestPlayerName");

const jailMinutes =
document.getElementById("jailMinutes");

const arrestReason =
document.getElementById("arrestReason");

const confirmArrest =
document.getElementById("confirmArrest");

let players=[];

let selectedPlayer=null;


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

status.classList.add("error");

status.innerHTML=
"Login required.";

return;

}


try{

const adminSnap=
await getDoc(
doc(db,"admins",user.uid)
);


if(
!adminSnap.exists() ||
adminSnap.data().active!==true ||
adminSnap.data().role!=="admin"
){

throw new Error(
"Administrator access denied."
);

}


status.innerHTML=`

<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"/>
<path d="M8 12l2.5 2.5L16 9"/>
</svg>

Administrator access granted

`;


await loadPlayers();


}catch(error){

status.classList.add("error");

status.textContent=
error.message;

}

});


/* =====================================================
   LOAD PLAYERS
===================================================== */

async function loadPlayers(){

const snap=
await getDocs(
collection(db,"players")
);

players=[];


snap.forEach(item=>{

players.push({
id:item.id,
...item.data()
});

});


updateStats();

render();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

const total=
players.length;

const banned=
players.filter(
p=>p.banned===true
).length;

const arrested=
players.filter(
p=>p.arrested===true
).length;

const active=
total-banned-arrested;


totalPlayers.textContent=
total;

activePlayers.textContent=
Math.max(active,0);

bannedPlayers.textContent=
banned;

arrestedPlayers.textContent=
arrested;

}


/* =====================================================
   RENDER
===================================================== */

function render(){

const q=
search.value
.trim()
.toLowerCase();

const f=
filter.value;


const list=
players.filter(p=>{

const text=[
p.name,
p.email,
p.uid,
p.city,
p.job
]
.join(" ")
.toLowerCase();


if(
q &&
!text.includes(q)
)return false;


if(
f==="banned" &&
p.banned!==true
)return false;


if(
f==="arrested" &&
p.arrested!==true
)return false;


if(
f==="active" &&
(
p.banned===true ||
p.arrested===true
)
)return false;


return true;

});


if(!list.length){

playersEl.innerHTML=
`
<div class="empty">
No players found.
</div>
`;

return;

}


playersEl.innerHTML=
list.map(p=>{

const banned=
p.banned===true;

const arrested=
p.arrested===true;


let jailText="";

if(
arrested &&
p.jailUntil
){

const time=
p.jailUntil.toDate
? p.jailUntil.toDate()
: new Date(p.jailUntil);

jailText=
"Until "+
time.toLocaleString();

}


return `

<div class="player">

<div class="player-main">

<div class="avatar">

<svg viewBox="0 0 24 24">
<circle cx="12" cy="8" r="4"/>
<path d="M4 21a8 8 0 0 1 16 0"/>
</svg>

</div>

<div>

<div class="name">
${escapeHtml(
p.name||"Unknown Player"
)}
</div>

<div class="sub">
${escapeHtml(
p.email||p.uid||""
)}
</div>

</div>

</div>


<div>

<div class="label">
City
</div>

<div class="value">
${escapeHtml(
p.city||"Unknown"
)}
</div>

</div>


<div>

<div class="label">
Level
</div>

<div class="value">
${Number(p.level||1)}
</div>

</div>


<div>

<div class="label">
Status
</div>

<div>

${
banned

?

`<span class="badge banned">
BANNED
</span>`

:

arrested

?

`<span class="badge arrested">
ARRESTED
</span>`

:

`<span class="badge active">
ACTIVE
</span>`

}

</div>

${
arrested
?
`<div
style="font-size:9px;color:#a98548;margin-top:5px;">
${escapeHtml(jailText)}
</div>`
:""
}

</div>


<div class="actions">


${
arrested

?

`<button
class="action release"
title="Release player"
data-action="release"
data-id="${escapeHtml(p.uid||p.id)}">

<svg viewBox="0 0 24 24">
<path d="M5 12h14"/>
<path d="M12 5l7 7-7 7"/>
</svg>

</button>`

:

`<button
class="action arrest"
title="Arrest player"
data-action="arrest"
data-id="${escapeHtml(p.uid||p.id)}"
data-name="${escapeHtml(p.name||"Player")}">

<svg viewBox="0 0 24 24">
<path d="M7 3h10"/>
<path d="M7 21h10"/>
<path d="M8 3v5l4 4-4 4v5"/>
<path d="M16 3v5l-4 4 4 4v5"/>
</svg>

</button>`

}


</div>

</div>

`;

}).join("");

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
"input",
render
);

filter.addEventListener(
"change",
render
);


/* =====================================================
   PLAYER ACTIONS
===================================================== */

playersEl.addEventListener(
"click",
async event=>{

const button=
event.target.closest("button");

if(!button)return;


const action=
button.dataset.action;

const uid=
button.dataset.id;


if(!uid)return;


if(action==="arrest"){

selectedPlayer=uid;

arrestPlayerName.textContent=
"Player: "+
button.dataset.name;

jailMinutes.value="30";

arrestReason.value="";

arrestModal.classList.add("show");

return;

}


if(action==="release"){

if(
!confirm(
"Release this player from jail?"
)
)return;


try{

const release=
httpsCallable(
functions,
"releasePlayer"
);

await release({
uid
});

await loadPlayers();

}catch(error){

alert(
error.message||
"Release failed."
);

}

}

});


/* =====================================================
   CONFIRM ARREST
===================================================== */

confirmArrest.addEventListener(
"click",
async()=>{

if(!selectedPlayer)return;


const duration=
Number(jailMinutes.value);

const reason=
arrestReason.value.trim();


if(
!Number.isFinite(duration) ||
duration<1 ||
duration>1440
){

alert(
"Choose a jail time between 1 and 1440 minutes."
);

return;

}


if(!reason){

alert(
"Enter an arrest reason."
);

return;

}


try{

confirmArrest.disabled=true;


const arrest=
httpsCallable(
functions,
"arrestPlayer"
);


await arrest({

uid:selectedPlayer,

durationMinutes:
duration,

reason

});


closeArrest();

await loadPlayers();


}catch(error){

alert(
error.message||
"Arrest failed."
);

}finally{

confirmArrest.disabled=false;

}

});


/* =====================================================
   CLOSE ARREST
===================================================== */

function closeArrest(){

arrestModal.classList.remove(
"show"
);

selectedPlayer=null;

}


document
.getElementById("closeArrest")
.addEventListener(
"click",
closeArrest
);


/* =====================================================
   REFRESH
===================================================== */

document
.getElementById("refreshBtn")
.addEventListener(
"click",
loadPlayers
);


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async()=>{

await signOut(auth);

location.reload();

});


</script>

</body>
</html>
