<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naija Life Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07130f;
      color: white;
    }

    header {
      padding: 20px;
      background: #0d2a20;
      border-bottom: 1px solid #1c4a38;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #9fb8ad;
      font-size: 14px;
    }

    main {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: #0d2119;
      border: 1px solid #1d4435;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #102d22;
      color: #7ff0bd;
      margin-bottom: 15px;
    }

    .error {
      background: #3a1515;
      color: #ff9d9d;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      margin: 3px;
    }

    .logout {
      background: #b52b2b;
      color: white;
    }

    .ban {
      background: #e0a800;
      color: #111;
    }

    .unban {
      background: #28a745;
      color: white;
    }

    .player {
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
      background: #091912;
      border: 1px solid #1c3c30;
    }

    .player strong {
      font-size: 17px;
    }

    .details {
      color: #a9c2b7;
      font-size: 13px;
      line-height: 1.7;
      margin-top: 8px;
    }

    #players {
      max-height: 600px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

<header>
  <h1>Naija Life — Admin Panel</h1>
  <p>Game administration dashboard</p>
</header>

<main>

  <div id="status" class="status">
    Checking admin access...
  </div>

  <div class="card">
    <h2>Admin Account</h2>

    <div id="adminInfo">
      Loading...
    </div>

    <button class="logout" id="logoutBtn">
      Logout
    </button>
  </div>

  <div class="card">
    <h2>Players</h2>

    <div id="players">
      Loading players...
    </div>
  </div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyBFXbsI4y4f7QepfK3NFrP3LBsIFAWAhEE",
  authDomain: "game-97f37.firebaseapp.com",
  projectId: "game-97f37",
  storageBucket: "game-97f37.firebasestorage.app",
  messagingSenderId: "584626250832",
  appId: "1:584626250832:web:57f076e095174ccd74dd55",
  databaseURL: "https://game-97f37-default-rtdb.firebaseio.com"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ELEMENTS */

const statusBox = document.getElementById("status");
const adminInfo = document.getElementById("adminInfo");
const playersBox = document.getElementById("players");
const logoutBtn = document.getElementById("logoutBtn");


/* AUTH CHECK */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    statusBox.textContent = "You are not logged in.";
    statusBox.classList.add("error");

    adminInfo.innerHTML = `
      <p>Please log into Naija Life first.</p>
    `;

    playersBox.innerHTML = `
      <p>Admin login required.</p>
    `;

    return;
  }


  try {

    const adminRef = doc(db, "admins", user.uid);

    const adminSnap = await getDoc(adminRef);


    if (!adminSnap.exists()) {

      statusBox.textContent = "Access denied — you are not an admin.";
      statusBox.classList.add("error");

      adminInfo.innerHTML = `
        <p>Admin account not found.</p>
      `;

      return;
    }


    const adminData = adminSnap.data();


    if (adminData.active !== true) {

      statusBox.textContent = "Admin account is inactive.";
      statusBox.classList.add("error");

      return;
    }


    /* ADMIN VERIFIED */

    statusBox.textContent = "Admin access granted.";

    adminInfo.innerHTML = `
      <p><strong>Email:</strong> ${escapeHtml(user.email || "")}</p>
      <p><strong>UID:</strong> ${escapeHtml(user.uid)}</p>
      <p><strong>Role:</strong> ${escapeHtml(adminData.role || "admin")}</p>
    `;


    await loadPlayers();

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Error: " + error.message;

    statusBox.classList.add("error");
  }

});


/* LOAD PLAYERS */

async function loadPlayers() {

  playersBox.innerHTML = "Loading players...";

  const snapshot = await getDocs(
    collection(db, "players")
  );


  if (snapshot.empty) {

    playersBox.innerHTML =
      "<p>No players found.</p>";

    return;
  }


  playersBox.innerHTML = "";


  snapshot.forEach((playerDoc) => {

    const p = playerDoc.data();

    const div = document.createElement("div");

    div.className = "player";


    div.innerHTML = `

      <strong>
        ${escapeHtml(p.name || "Unknown Player")}
      </strong>

      <div class="details">

        UID:
        ${escapeHtml(p.uid || playerDoc.id)}
        <br>

        Email:
        ${escapeHtml(p.email || "Not available")}
        <br>

        City:
        ${escapeHtml(p.city || "Unknown")}
        <br>

        Level:
        ${Number(p.level || 1)}
        <br>

        XP:
        ${Number(p.xp || 0)}
        <br>

        Money:
        ₦${Number(p.money || 0).toLocaleString()}
        <br>

        Status:
        ${p.banned ? "BANNED" : "ACTIVE"}

      </div>

    `;


    playersBox.appendChild(div);

  });

}


/* LOGOUT */

logoutBtn.addEventListener("click", async () => {

  await signOut(auth);

  location.reload();

});


/* SECURITY */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
