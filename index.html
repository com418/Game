<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naija Life Online</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#06110b;
  color:#f5fff8;
  font-family:system-ui,-apple-system,sans-serif;
  overflow:hidden;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  border-radius:14px;
  padding:12px 14px;
  font-weight:800;
}

#auth{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 25% 10%,#185b3d,#06110b 58%);
}

.card{
  width:min(440px,100%);
  background:#102219;
  border:1px solid #315540;
  border-radius:26px;
  padding:24px;
  box-shadow:0 25px 90px #0009;
}

.logo{
  font-size:31px;
  font-weight:950;
}

.muted{
  color:#a9beb1;
}

.field{
  width:100%;
  padding:14px;
  margin:7px 0;
  background:#08150e;
  color:#fff;
  border:1px solid #345744;
  border-radius:13px;
  outline:none;
}

.primary{
  background:#18b968;
  color:#03150b;
}

.ghost{
  background:#1b3025;
  color:#fff;
}

.danger{
  background:#a83242;
  color:#fff;
}

#game{
  display:none;
  position:fixed;
  inset:0;
}

#world{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}

.pill{
  background:#06110de8;
  border:1px solid #355744;
  padding:8px 11px;
  border-radius:14px;
  font-size:12px;
}

#toast{
  position:absolute;
  left:50%;
  bottom:110px;
  transform:translateX(-50%);
  background:#07130df5;
  padding:11px 15px;
  border-radius:14px;
  display:none;
  z-index:40;
}

#controls{
  position:absolute;
  left:14px;
  right:14px;
  bottom:15px;
  display:flex;
  justify-content:space-between;
  align-items:end;
}

#stick{
  width:112px;
  height:112px;
  border-radius:50%;
  background:#06110db5;
  border:1px solid #668071;
  position:relative;
  touch-action:none;
}

#knob{
  position:absolute;
  width:48px;
  height:48px;
  left:32px;
  top:32px;
  border-radius:50%;
  background:#e2eee6;
}

.actions{
  display:grid;
  grid-template-columns:repeat(2,65px);
  gap:8px;
}

.actions button{
  background:#06110de8;
  color:#fff;
  border:1px solid #355744;
}

#panel{
  position:absolute;
  inset:7% 4%;
  display:none;
  background:#0b1711f8;
  border:1px solid #355744;
  border-radius:24px;
  z-index:30;
  padding:18px;
  overflow:auto;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid #20392a;
}

.item{
  background:#13271c;
  padding:12px;
  border-radius:15px;
  margin:7px 0;
}

.small{
  font-size:12px;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">

  <div class="card">

    <div class="logo">🇳🇬 Naija Life</div>

    <p class="muted">
      Online Nigerian life simulator
    </p>

    <input
      id="name"
      class="field"
      placeholder="Character name"
    >

    <input
      id="email"
      class="field"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      class="field"
      type="password"
      placeholder="Password (6+ characters)"
    >

    <select id="city" class="field">
      <option>Lagos</option>
      <option>Warri</option>
      <option>Abuja</option>
      <option>Benin City</option>
      <option>Port Harcourt</option>
      <option>Onitsha</option>
      <option>Enugu</option>
      <option>Ibadan</option>
    </select>

    <button
      id="register"
      class="primary"
      style="width:100%"
    >
      Create account
    </button>

    <button
      id="login"
      class="ghost"
      style="width:100%;margin-top:8px"
    >
      Login
    </button>

    <p id="authMsg" class="muted small"></p>

  </div>

</div>


<!-- GAME -->
<div id="game">

  <canvas id="world"></canvas>

  <div id="hud">

    <div class="pill">
      <b id="playerName">Player</b>
      <br>
      <span id="cityText">Lagos</span>
      ·
      <span id="clock">--:--</span>
    </div>

    <div class="pill">
      ₦<span id="money">0</span>
      · Lv <span id="level">1</span>
      · ❤️ <span id="health">100</span>
    </div>

  </div>


  <div id="toast"></div>


  <div id="controls">

    <div id="stick">
      <div id="knob"></div>
    </div>

    <div class="actions">

      <button id="act">
        ACT
      </button>

      <button id="phone">
        PHONE
      </button>

      <button id="save">
        SAVE
      </button>

      <button id="logout">
        EXIT
      </button>

    </div>

  </div>


  <div id="panel"></div>

</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  limit,
  serverTimestamp,
  arrayUnion
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
  getDatabase,
  ref,
  set,
  onDisconnect,
  onValue,
  serverTimestamp as rtdbTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBFXbsI4y4f7QepfK3NFrP3LBsIFAWAhEE",

  authDomain:
    "game-97f37.firebaseapp.com",

  projectId:
    "game-97f37",

  storageBucket:
    "game-97f37.firebasestorage.app",

  messagingSenderId:
    "584626250832",

  appId:
    "1:584626250832:web:57f076e095174ccd74dd55",

  databaseURL:
    "https://game-97f37-default-rtdb.firebaseio.com"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const rtdb = getDatabase(app);


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


function toast(message){

  const element = $("toast");

  element.textContent = message;

  element.style.display = "block";

  clearTimeout(window.__toast);

  window.__toast = setTimeout(() => {

    element.style.display = "none";

  },2600);

}


/* =========================
   GAME STATE
========================= */

let user = null;

let player = null;

let playerPresence = null;

let onlinePlayers = {};

let posX = 600;

let posY = 450;

let joystick = {
  x:0,
  y:0
};

let keys = {};

let lastFrame =
  performance.now();


/* =========================
   CANVAS
========================= */

const canvas =
  $("world");

const ctx =
  canvas.getContext("2d");


let width;
let height;


function resize(){

  width =
    canvas.width =
      innerWidth * devicePixelRatio;

  height =
    canvas.height =
      innerHeight * devicePixelRatio;

  canvas.style.width =
    innerWidth + "px";

  canvas.style.height =
    innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}


addEventListener(
  "resize",
  resize
);

resize();


/* =========================
   REGISTER
========================= */

$("register").onclick =
async function(){

  try{

    const email =
      $("email").value.trim();

    const password =
      $("password").value;

    const name =
      $("name").value.trim() ||
      "Player";

    const city =
      $("city").value;


    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );


    await setDoc(
      doc(
        db,
        "players",
        result.user.uid
      ),
      {

        uid:
          result.user.uid,

        name,

        city,

        money:
          50000,

        level:
          1,

        xp:
          0,

        health:
          100,

        energy:
          100,

        hunger:
          100,

        hygiene:
          100,

        happiness:
          100,

        job:
          "Unemployed",

        friends:
          [],

        banned:
          false,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );


    toast(
      "Account created successfully"
    );


  }catch(error){

    $("authMsg").textContent =
      error.message;

  }

};


/* =========================
   LOGIN
========================= */

$("login").onclick =
async function(){

  try{

    await signInWithEmailAndPassword(

      auth,

      $("email").value.trim(),

      $("password").value

    );

  }catch(error){

    $("authMsg").textContent =
      error.message;

  }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async currentUser => {

    user =
      currentUser;


    if(!currentUser){

      $("auth").style.display =
        "grid";

      $("game").style.display =
        "none";

      return;

    }


    const snapshot =
      await getDoc(
        doc(
          db,
          "players",
          currentUser.uid
        )
      );


    if(!snapshot.exists()){

      await signOut(auth);

      return;

    }


    player =
      snapshot.data();


    if(player.banned === true){

      $("authMsg").textContent =
        "This account is suspended.";

      await signOut(auth);

      return;

    }


    $("auth").style.display =
      "none";

    $("game").style.display =
      "block";


    $("playerName").textContent =
      player.name;

    $("cityText").textContent =
      player.city;


    connectPresence();


    listenForPlayers();


    toast(
      "Welcome to Naija Life, " +
      player.name +
      "!"
    );

  }
);


/* =========================
   REALTIME PRESENCE
========================= */

function connectPresence(){

  playerPresence =
    ref(
      rtdb,
      "presence/" +
      user.uid
    );


  set(
    playerPresence,
    {

      uid:
        user.uid,

      name:
        player.name,

      city:
        player.city,

      x:
        posX,

      y:
        posY,

      online:
        true,

      lastSeen:
        rtdbTimestamp()

    }
  );


  onDisconnect(
    playerPresence
  ).set({

    uid:
      user.uid,

    name:
      player.name,

    city:
      player.city,

    online:
      false,

    lastSeen:
      rtdbTimestamp()

  });

}


function listenForPlayers(){

  onValue(
    ref(rtdb,"presence"),
    snapshot => {

      onlinePlayers =
        snapshot.val() || {};

    }
  );

}


/* =========================
   CLOUD SAVE
========================= */

async function saveGame(){

  if(!user) return;


  await updateDoc(

    doc(
      db,
      "players",
      user.uid
    ),

    {

      x:
        posX,

      y:
        posY,

      updatedAt:
        serverTimestamp()

    }

  );


  if(playerPresence){

    await set(
      playerPresence,
      {

        uid:
          user.uid,

        name:
          player.name,

        city:
          player.city,

        x:
          posX,

        y:
          posY,

        online:
          true,

        lastSeen:
          rtdbTimestamp()

      }
    );

  }


  toast(
    "Cloud save complete ✓"
  );

}


$("save").onclick =
saveGame;


/* =========================
   PHONE
========================= */

$("phone").onclick =
openPhone;


function openPhone(){

  showPanel(`

    <h2>📱 Phone</h2>

    <div class="item">

      <b>WhatsApp-style Chat</b>

      <p class="small">
        Talk with other Naija Life players.
      </p>

      <button
        class="primary"
        onclick="openChat()"
      >
        Open Chat
      </button>

    </div>


    <div class="item">

      <b>Friends</b>

      <p class="small">
        Find other players and add friends.
      </p>

      <button
        class="ghost"
        onclick="openFriends()"
      >
        Friends
      </button>

    </div>


    <div class="item">

      <b>NaijaBank</b>

      <p>
        Game balance:
        ₦${Number(
          player.money || 0
        ).toLocaleString()}
      </p>

    </div>


    <button
      class="ghost"
      onclick="closePanel()"
    >
      Close
    </button>

  `);

}


/* =========================
   FRIENDS
========================= */

window.openFriends =
async function(){

  showPanel(
    "<h2>👥 Players</h2>" +
    "<div id='playersList'>Loading...</div>" +
    "<button class='ghost' onclick='closePanel()'>Close</button>"
  );


  const q =
    query(
      collection(db,"players"),
      limit(30)
    );


  onSnapshot(
    q,
    snapshot => {

      let html = "";

      snapshot.forEach(
        document => {

          const p =
            document.data();


          if(
            document.id ===
            user.uid
          )
            return;


          html += `

            <div class="item">

              <b>
                ${escapeHTML(
                  p.name || "Player"
                )}
              </b>

              <br>

              <span class="small">

                ${escapeHTML(
                  p.city || "Nigeria"
                )}

                · Level
                ${p.level || 1}

              </span>

              <br><br>

              <button
                class="primary"
                onclick="
                  addFriend('${document.id}')
                "
              >
                Add friend
              </button>

            </div>

          `;

        }
      );


      $("playersList").innerHTML =
        html ||
        "<p>No other players yet.</p>";

    }
  );

};


window.addFriend =
async function(uid){

  await updateDoc(

    doc(
      db,
      "players",
      user.uid
    ),

    {

      friends:
        arrayUnion(uid),

      updatedAt:
        serverTimestamp()

    }

  );


  toast(
    "Friend added ✓"
  );

};


/* =========================
   CHAT
========================= */

window.openChat =
async function(){

  showPanel(`

    <h2>💬 Naija Life Chat</h2>

    <div
      id="messages"
      class="list"
    >
      Loading...
    </div>

    <input
      id="chatMessage"
      class="field"
      maxlength="500"
      placeholder="Type a message..."
    >

    <button
      class="primary"
      onclick="sendChat()"
    >
      Send
    </button>

    <button
      class="ghost"
      onclick="closePanel()"
    >
      Close
    </button>

  `);


  const q =
    query(
      collection(db,"chat"),
      orderBy(
        "createdAt",
        "desc"
      ),
      limit(40)
    );


  onSnapshot(
    q,
    snapshot => {

      let html = "";


      snapshot.docs
        .reverse()
        .forEach(
          document => {

            const message =
              document.data();


            html += `

              <div class="item">

                <b>
                  ${escapeHTML(
                    message.name
                  )}
                </b>

                <br>

                ${escapeHTML(
                  message.text || ""
                )}

              </div>

            `;

          }
        );


      $("messages").innerHTML =
        html ||
        "<p>No messages yet.</p>";

    }
  );

};


window.sendChat =
async function(){

  const input =
    $("chatMessage");

  const text =
    input.value.trim();


  if(!text)
    return;


  await addDoc(

    collection(
      db,
      "chat"
    ),

    {

      uid:
        user.uid,

      name:
        player.name,

      text,

      createdAt:
        serverTimestamp()

    }

  );


  input.value = "";

};


function escapeHTML(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      })[character]
    );

}


/* =========================
   PANELS
========================= */

function showPanel(html){

  $("panel").innerHTML =
    html;

  $("panel").style.display =
    "block";

}


window.closePanel =
function(){

  $("panel").style.display =
    "none";

};


/* =========================
   ACT
========================= */

$("act").onclick =
function(){

  toast(
    "Explore the city and interact with buildings and players."
  );

};


/* =========================
   LOGOUT
========================= */

$("logout").onclick =
function(){

  signOut(auth);

};


/* =========================
   KEYBOARD
========================= */

addEventListener(
  "keydown",
  event => {

    keys[
      event.key.toLowerCase()
    ] = true;

  }
);


addEventListener(
  "keyup",
  event => {

    keys[
      event.key.toLowerCase()
    ] = false;

  }
);


/* =========================
   MOBILE JOYSTICK
========================= */

const stick =
  $("stick");

const knob =
  $("knob");

let dragging =
  false;


stick.addEventListener(
  "pointerdown",
  event => {

    dragging = true;

    stick.setPointerCapture(
      event.pointerId
    );

    moveJoystick(event);

  }
);


stick.addEventListener(
  "pointermove",
  event => {

    if(dragging)
      moveJoystick(event);

  }
);


stick.addEventListener(
  "pointerup",
  resetJoystick
);


stick.addEventListener(
  "pointercancel",
  resetJoystick
);


function moveJoystick(event){

  const rect =
    stick.getBoundingClientRect();


  let x =
    event.clientX -
    (
      rect.left +
      rect.width / 2
    );


  let y =
    event.clientY -
    (
      rect.top +
      rect.height / 2
    );


  const distance =
    Math.hypot(x,y);


  const maximum =
    42;


  if(distance > maximum){

    x =
      x / distance *
      maximum;

    y =
      y / distance *
      maximum;

  }


  knob.style.transform =
    `translate(${x}px,${y}px)`;


  joystick.x =
    x / maximum;

  joystick.y =
    y / maximum;

}


function resetJoystick(){

  dragging = false;

  joystick.x = 0;

  joystick.y = 0;

  knob.style.transform =
    "";

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

  requestAnimationFrame(
    gameLoop
  );


  const now =
    performance.now();


  const delta =
    Math.min(
      0.04,
      (now-lastFrame)/1000
    );


  lastFrame =
    now;


  let x =
    joystick.x;

  let y =
    joystick.y;


  if(keys["w"])
    y -= 1;

  if(keys["s"])
    y += 1;

  if(keys["a"])
    x -= 1;

  if(keys["d"])
    x += 1;


  const magnitude =
    Math.hypot(x,y);


  if(magnitude > 0){

    x /= magnitude;

    y /= magnitude;

    posX +=
      x *
      180 *
      delta;

    posY +=
      y *
      180 *
      delta;

  }


  posX =
    Math.max(
      40,
      Math.min(
        3560,
        posX
      )
    );


  posY =
    Math.max(
      40,
      Math.min(
        2460,
        posY
      )
    );


  drawWorld();

}


function drawWorld(){

  const screenW =
    innerWidth;

  const screenH =
    innerHeight;


  ctx.clearRect(
    0,
    0,
    screenW,
    screenH
  );


  const cameraX =
    posX -
    screenW / 2;


  const cameraY =
    posY -
    screenH / 2;


  /* GRASS */

  ctx.fillStyle =
    "#79aa70";

  ctx.fillRect(
    0,
    0,
    screenW,
    screenH
  );


  ctx.save();

  ctx.translate(
    -cameraX,
    -cameraY
  );


  /* MAIN ROADS */

  ctx.fillStyle =
    "#4b4f4a";

  ctx.fillRect(
    0,
    700,
    3600,
    170
  );

  ctx.fillRect(
    1650,
    0,
    170,
    2460
  );


  /* BUILDINGS */

  const buildings = [

    ["BANK",400,380],

    ["HOSPITAL",950,350],

    ["MARKET",1450,420],

    ["RESTAURANT",2150,360],

    ["POLICE",2750,420],

    ["CLUB",500,1100],

    ["CHURCH",1200,1120],

    ["SHOP",2100,1100],

    ["GYM",2800,1100],

    ["HOME",500,1850],

    ["SCHOOL",1500,1850],

    ["WORK",2400,1850]

  ];


  for(
    const [
      name,
      x,
      y
    ] of buildings
  ){

    ctx.fillStyle =
      "#d9b58c";

    ctx.fillRect(
      x,
      y,
      220,
      150
    );


    ctx.fillStyle =
      "#153e2c";

    ctx.fillRect(
      x + 20,
      y + 35,
      180,
      100
    );


    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "bold 16px system-ui";

    ctx.fillText(
      name,
      x + 45,
      y + 25
    );

  }


  /* OTHER PLAYERS */

  for(
    const [
      id,
      other
    ] of Object.entries(
      onlinePlayers
    )
  ){

    if(
      id === user?.uid ||
      !other.online ||
      other.city !== player?.city
    )
      continue;


    ctx.fillStyle =
      "#2479ff";

    ctx.beginPath();

    ctx.arc(
      other.x || 0,
      other.y || 0,
      16,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#fff";

    ctx.font =
      "12px system-ui";

    ctx.fillText(
      other.name || "Player",
      (other.x || 0)-25,
      (other.y || 0)-23
    );

  }


  /* PLAYER */

  ctx.fillStyle =
    "#f0c7a5";

  ctx.beginPath();

  ctx.arc(
    posX,
    posY - 25,
    13,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle =
    "#168b55";

  ctx.fillRect(
    posX - 14,
    posY - 12,
    28,
    34
  );


  ctx.fillStyle =
    "#07110d";

  ctx.fillRect(
    posX - 10,
    posY + 22,
    7,
    18
  );

  ctx.fillRect(
    posX + 3,
    posY + 22,
    7,
    18
  );


  ctx.restore();


  /* HUD */

  $("money").textContent =
    Number(
      player?.money || 0
    ).toLocaleString();


  $("level").textContent =
    player?.level || 1;


  $("health").textContent =
    Math.round(
      player?.health || 100
    );


  const nigeriaTime =
    new Intl.DateTimeFormat(
      "en-NG",
      {
        timeZone:
          "Africa/Lagos",

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false
      }
    ).format(
      new Date()
    );


  $("clock").textContent =
    nigeriaTime;


  /* SEND POSITION */

  if(
    playerPresence &&
    Math.random() < 0.04
  ){

    set(
      playerPresence,
      {

        uid:
          user.uid,

        name:
          player.name,

        city:
          player.city,

        x:
          posX,

        y:
          posY,

        online:
          true,

        lastSeen:
          rtdbTimestamp()

      }
    );

  }

}


gameLoop();

</script>

</body>
</html>
