<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Naija Life — Enterable Buildings</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08110d;font-family:Arial,sans-serif;color:#fff}
button{font:inherit;border:0;cursor:pointer}
#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#183d2d;
}
#world,#interior{
  position:absolute;
  width:3600px;
  height:2600px;
  transform-origin:0 0;
}
#world{
  background:
    linear-gradient(90deg,transparent 0 49%,rgba(255,255,255,.035) 49.2% 49.5%,transparent 49.7%),
    #72a95f;
}
#interior{
  display:none;
  width:1600px;
  height:1000px;
  background:#d9d2c5;
}
.water{
  position:absolute;
  background:#287ca0;
  border:8px solid #23647f;
}
#lagoon{
  left:1450px;
  top:0;
  width:650px;
  height:1200px;
  border-radius:0 0 50% 50%;
}
#ocean{
  left:0;
  top:1900px;
  width:3600px;
  height:700px;
}
.road{
  position:absolute;
  background:#353a3c;
  border:4px solid #555;
}
.road.h{height:90px}
.road.v{width:90px}
.lane{
  position:absolute;
  border-color:#e5d36d;
  border-style:dashed;
}
.building{
  position:absolute;
  width:190px;
  height:130px;
  border:5px solid #26332d;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  color:#fff;
  cursor:pointer;
  user-select:none;
}
.building small{
  display:block;
  margin-top:7px;
  font-weight:600;
  opacity:.85;
}
.office{background:#315d83}
.bank{background:#155c46}
.hospital{background:#a43f48}
.school{background:#c98d38}
.market{background:#8b573d}
.restaurant{background:#b55b31}
.police{background:#294d7b}
.church{background:#624d8b}
.shop{background:#8b3f72}
.club{background:#35264e}
.gym{background:#4a6241}
.salon{background:#a35b83}
.fuel{background:#725b2f}
.home{background:#875f46}
.hotel{background:#536c7a}
.palm{
  position:absolute;
  width:30px;
  height:120px;
}
.palm:before{
  content:"";
  position:absolute;
  left:12px;
  bottom:0;
  width:7px;
  height:70px;
  background:#65452d;
  border-radius:5px;
}
.palm:after{
  content:"✦";
  position:absolute;
  top:0;
  left:-18px;
  font-size:65px;
  color:#175c35;
}
#worldPeople,#interiorPeople{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.character{
  position:absolute;
  width:52px;
  height:78px;
  transform:translate(-50%,-50%);
  z-index:50;
}
.character svg{
  width:100%;
  height:100%;
  overflow:visible;
}
#player{
  z-index:100;
}
#camera{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:500;
  pointer-events:none;
}
.hudBox{
  background:rgba(5,18,12,.78);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(10px);
  padding:10px 13px;
  border-radius:15px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}
#stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.stat{
  font-size:12px;
  font-weight:800;
}
#clock{
  font-size:15px;
  font-weight:900;
  text-align:right;
}
#controls{
  position:fixed;
  inset:0;
  z-index:600;
  pointer-events:none;
}
#joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.25);
  pointer-events:auto;
}
#stick{
  position:absolute;
  width:55px;
  height:55px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:rgba(255,255,255,.75);
}
.actions{
  position:absolute;
  right:18px;
  bottom:20px;
  display:flex;
  gap:9px;
  pointer-events:auto;
}
.action{
  width:64px;
  height:64px;
  border-radius:20px;
  background:rgba(7,24,16,.86);
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  font-size:11px;
  font-weight:900;
}
.action.primary{
  background:#00a86b;
}
#interiorBar{
  position:fixed;
  top:85px;
  left:50%;
  transform:translateX(-50%);
  z-index:700;
  display:none;
  align-items:center;
  gap:10px;
}
#interiorTitle{
  background:rgba(8,20,14,.9);
  padding:12px 18px;
  border-radius:14px;
  font-weight:900;
}
#exitBuilding{
  background:#b83d45;
  color:#fff;
  padding:12px 17px;
  border-radius:14px;
  font-weight:900;
}
#modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.48);
}
.modalCard{
  width:min(520px,94%);
  margin-bottom:18px;
  background:#10251a;
  border:1px solid rgba(255,255,255,.16);
  border-radius:25px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.modalCard h2{
  margin:0 0 6px;
}
.modalCard p{
  color:#b8c7bf;
  margin:7px 0 15px;
}
.modalBtns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.modalBtns button{
  padding:14px;
  border-radius:14px;
  background:#1d3a2a;
  color:#fff;
  font-weight:800;
}
.modalBtns .enter{
  background:#00a86b;
}
.modalBtns .close{
  background:#713b40;
}
#phone{
  position:fixed;
  inset:0;
  z-index:1100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
}
.phoneBody{
  width:min(380px,94%);
  height:min(700px,88vh);
  background:#101414;
  border:7px solid #262b2a;
  border-radius:35px;
  padding:18px;
  box-shadow:0 30px 90px #000;
}
.phoneTop{
  display:flex;
  justify-content:space-between;
  font-weight:900;
}
.phoneScreen{
  margin-top:18px;
  height:calc(100% - 60px);
  background:#eef4ef;
  color:#122018;
  border-radius:25px;
  padding:18px;
  overflow:auto;
}
.phoneScreen button{
  width:100%;
  margin:6px 0;
  padding:13px;
  border-radius:12px;
  background:#dbe8df;
  color:#10251a;
  font-weight:800;
}
#creator{
  position:fixed;
  inset:0;
  z-index:2000;
  background:linear-gradient(145deg,#092017,#12462e);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.creatorCard{
  width:min(480px,100%);
  max-height:92vh;
  overflow:auto;
  background:rgba(8,22,15,.95);
  border:1px solid rgba(255,255,255,.18);
  border-radius:28px;
  padding:24px;
}
.creatorCard h1{
  margin-top:0;
}
.creatorCard label{
  display:block;
  margin-top:13px;
  margin-bottom:5px;
  color:#b7c9bf;
  font-size:13px;
  font-weight:700;
}
.creatorCard input,
.creatorCard select{
  width:100%;
  padding:14px;
  border-radius:13px;
  border:1px solid #385443;
  background:#152b20;
  color:#fff;
}
.start{
  width:100%;
  margin-top:20px;
  padding:15px;
  border-radius:15px;
  background:#00a86b;
  color:#fff;
  font-weight:900;
  font-size:16px;
}
.night{
  position:fixed;
  inset:0;
  background:rgba(5,10,35,.38);
  z-index:450;
  pointer-events:none;
  display:none;
}
#toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  z-index:1500;
  background:#10251a;
  padding:12px 17px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}
#toast.show{opacity:1}
.interiorFloor{
  fill:#d7cdbd;
  stroke:#8c8172;
  stroke-width:8;
}
.interiorWall{
  fill:#b5aa9a;
  stroke:#756b5f;
  stroke-width:10;
}
.roomLabel{
  font-size:32px;
  font-weight:900;
  fill:#3a342e;
}
.furniture{
  cursor:pointer;
}
.furniture rect,
.furniture circle{
  stroke:#473b31;
  stroke-width:6;
}
.furniture text{
  font-size:22px;
  font-weight:900;
  fill:#302a25;
  pointer-events:none;
}
@media(max-width:600px){
  .building{
    width:155px;
    height:108px;
    font-size:12px;
  }
  #stats .stat:nth-child(3){display:none}
}
</style>
</head>
<body>
<div id="game">
  <div id="camera">
    <div id="world">
  <div id="lagoon" class="water"></div>
  <div id="ocean" class="water"></div>
  <div class="road h" style="left:0;top:550px;width:3600px"></div>
  <div class="road h" style="left:0;top:1050px;width:3600px"></div>

  <div class="road v" style="left:650px;top:0;height:2600px"></div>
  <div class="road v" style="left:1250px;top:0;height:2600px"></div>

  </div>

  </div>

  </div>

  </div>

  </div>
  <div class="building hotel" data-place="hotel" style="left:600px;top:2050px">

  </div>
  <div class="building restaurant" data-place="restaurant" style="left:1800px;top:2050px">

  </div>
  <div class="building shop" data-place="shop" style="left:2700px;top:2050px">
    SHOP
  </div>
  <div class="palm" style="left:100px;top:300px"></div>
  <div class="palm" style="left:500px;top:300px"></div>
  <div class="palm" style="left:1900px;top:300px"></div>
  <div class="palm" style="left:2700px;top:300px"></div>
  <div class="palm" style="left:3200px;top:700px"></div>
  <div class="palm" style="left:1800px;top:1250px"></div>
  <div class="palm" style="left:3200px;top:1750px"></div>

</div>
<div id="interior"></div>

</div>

  <div class="hudBox">
    <div id="stats">
      <div class="stat">₦<span id="money">25000</span></div>

    <div class="phoneTop">
      <span>Naija Phone</span>
      <button id="closePhone">✕</button>
    </div>
<div class="phoneScreen">
  <h2>Phone</h2>
  <button onclick="phoneMessage()">Messages</button>
  <button onclick="phoneFriends()">Friends</button>
  <button onclick="phoneCalls()">Calls</button>
  <button onclick="showToast('No new notifications')">Notifications</button>

  </div>
</div>
<div id="toast"></div>
<div id="creator">
  <div class="creatorCard">
    <h1>Naija Life</h1>
    <p>Create your character and start your life in Nigeria.</p>
<label>Your name</label>
<input id="nameInput" placeholder="Enter your name">
<label>City</label>
<select id="cityInput">
  <option>Lagos</option>
  <option>Warri</option>
</select>
<label>Skin</label>
<select id="skinInput">
  <option value="#6b3d25">Dark</option>
  <option value="#8b5135">Brown</option>
  <option value="#a96b49">Light Brown</option>
  <option value="#c98a67">Light</option>
</select>
<label>Shirt</label>
<select id="shirtInput">
  <option value="#168f5b">Green</option>
  <option value="#2366a8">Blue</option>
  <option value="#c94a4a">Red</option>
  <option value="#222">Black</option>
  <option value="#eee">White</option>
</select>
<button class="start" id="startGame">START LIFE</button>

</div>
<script>
/* =========================
   GAME STATE
========================= */
const state={
  name:"",
  city:"Lagos",
  money:25000,
  energy:100,
  level:1,
  x:720,
  y:700,
  speed:3.2,
  running:false,
  gameMode:"outdoor",
  interior:null,
  returnPoint:null,
  skin:"#8b5135",
  shirt:"#168f5b"
};
const player=document.getElementById("player");
const world=document.getElementById("world");
const interior=document.getElementById("interior");
const modal=document.getElementById("modal");
const worldPeople=document.getElementById("worldPeople");
let keys={};
let joystick={x:0,y:0};
let lastTime=performance.now();
let toastTimer=null;
/* =========================
   SVG HUMAN
========================= */
function humanSVG(skin,shirt,hair="#151515",pants="#20252a",female=false){
  return `
  <svg viewBox="0 0 100 145">
    <ellipse cx="50" cy="138" rx="22" ry="5" fill="rgba(0,0,0,.25)"/>
    <rect x="34" y="72" width="32" height="43" rx="12" fill="${shirt}"/>
    <rect x="22" y="76" width="12" height="39" rx="6" fill="${skin}"/>
    <rect x="66" y="76" width="12" height="39" rx="6" fill="${skin}"/>
    <circle cx="28" cy="116" r="7" fill="${skin}"/>
    <circle cx="72" cy="116" r="7" fill="${skin}"/>
    <rect x="37" y="108" width="11" height="28" rx="5" fill="${pants}"/>
    <rect x="52" y="108" width="11" height="28" rx="5" fill="${pants}"/>
    <rect x="33" y="133" width="19" height="7" rx="3" fill="#111"/>
    <rect x="49" y="133" width="19" height="7" rx="3" fill="#111"/>
    <circle cx="50" cy="48" r="25" fill="${skin}"/>
    <circle cx="40" cy="48" r="3" fill="#151515"/>
    <circle cx="60" cy="48" r="3" fill="#151515"/>
    <path d="M44 60 Q50 64 56 60" fill="none" stroke="#421f17" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 43 Q27 15 50 16 Q76 15 76 43
             Q68 27 53 29 Q37 27 25 43Z"
          fill="${hair}"/>
    <path d="M34 69 Q50 76 66 69" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="3"/>
  </svg>`;
}
function setPlayerSVG(){
  player.innerHTML=humanSVG(state.skin,state.shirt);
}
/* =========================
   CREATOR
========================= */
document.getElementById("startGame").onclick=()=>{
  state.name=document.getElementById("nameInput").value.trim() || "Player";
  state.city=document.getElementById("cityInput").value;
  state.skin=document.getElementById("skinInput").value;
  state.shirt=document.getElementById("shirtInput").value;
  localStorage.setItem("naijaLifeCharacter",JSON.stringify(state));
  if(state.city==="Warri"){
    state.x=3300;
    state.y=1650;
  }
  setPlayerSVG();
  document.getElementById("creator").style.display="none";
  updateClock();
  spawnNPCs();
  showToast("Welcome to Naija Life, "+state.name);
};
/* =========================
   LOAD CHARACTER
========================= */
try{
  const saved=JSON.parse(localStorage.getItem("naijaLifeCharacter"));
  if(saved && saved.name){
    Object.assign(state,saved);
    setPlayerSVG();
    document.getElementById("creator").style.display="none";
    spawnNPCs();
  }
}catch(e){}
/* =========================
   CLOCK
========================= */
function nigeriaTime(){
  return new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Lagos"}));
}
function updateClock(){
  const d=nigeriaTime();
  let h=d.getHours();
  let m=d.getMinutes();
  document.getElementById("clock").textContent=
    String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  const night=h>=19 || h<6;
  document.getElementById("night").style.display=night?"block":"none";
  if(state.gameMode==="outdoor"){
    document.getElementById("location").textContent=state.city;
  }
}
setInterval(updateClock,1000);
/* =========================
   NPC SYSTEM
========================= */
const npcNames=[
 "Tunde","Amaka","Chinedu","Blessing","David","Joy",
 "Emeka","Mercy","Daniel","Ada","Kelechi","Esther"
];
const npcColors=[
 ["#6b3d25","#222","#174e9a","#242424"],
 ["#8b5135","#4a2416","#b33c3c","#292929"],
 ["#a96b49","#151515","#168f5b","#313131"],
 ["#c98a67","#24150f","#d18a25","#292929"]
];
let npcs=[];
function spawnNPCs(){
  worldPeople.innerHTML="";
  npcs=[];
  npcNames.forEach((name,i)=>{
    const el=document.createElement("div");
    el.className="character";
    el.innerHTML=humanSVG(
      npcColors[i%npcColors.length][0],
      npcColors[i%npcColors.length][2],
      npcColors[i%npcColors.length][1],
      npcColors[i%npcColors.length][3]
    );
    worldPeople.appendChild(el);
    npcs.push({
      name,
      el,
      x:300+Math.random()*3000,
      y:250+Math.random()*1900,
      tx:300+Math.random()*3000,
      ty:250+Math.random()*1900,
      speed:.7+Math.random()*.8
    });
  });
}
function updateNPCs(){
  npcs.forEach(n=>{
    const dx=n.tx-n.x;
    const dy=n.ty-n.y;
    const d=Math.hypot(dx,dy);
    if(d<20){
      n.tx=250+Math.random()*3100;
      n.ty=200+Math.random()*1900;
    }else{
      n.x+=(dx/d)*n.speed;
      n.y+=(dy/d)*n.speed;
    }
    n.el.style.left=n.x+"px";
    n.el.style.top=n.y+"px";
  });
}
/* =========================
   PLACE DATA
========================= */
const placeData={
  work:{
    title:"Office",
    text:"A modern Lagos workplace.",
    activities:["WORK","MEET PEOPLE"]
  },
  bank:{
    title:"Bank",
    text:"Use the lobby, ATM and teller area.",
    activities:["CHECK BALANCE","ATM"]
  },
  hospital:{
    title:"Hospital",
    text:"Reception, wards and treatment rooms.",
    activities:["RECEPTION","REST"]
  },
  school:{
    title:"School",
    text:"Classrooms and school grounds.",

document.querySelectorAll(".building").forEach(b=>{

function buildingCenter(el){
  return {
    x:parseFloat(el.style.left)+el.offsetWidth/2,
    y:parseFloat(el.style.top)+el.offsetHeight/2
  };
}
function openBuilding(key,el){
  const data=placeData[key];
  if(!data)return;
  const center=buildingCenter(el);
  const distance=Math.hypot(state.x-center.x,state.y-center.y);
  const close=distance<260;
  document.getElementById("modalTitle").textContent=data.title;
  document.getElementById("modalText").textContent=
    close
    ? data.text+" You are close enough to enter."
    : data.text+" Walk closer to the entrance to enter the building.";
  const btns=document.getElementById("modalBtns");
  btns.innerHTML="";
  if(close){
    const enter=document.createElement("button");
    enter.className="enter";
    enter.textContent="ENTER BUILDING";
    enter.onclick=()=>enterBuilding(key);
    btns.appendChild(enter);
  }
  data.activities.forEach(a=>{
    const btn=document.createElement("button");
    btn.textContent=a;
    btn.onclick=()=>{
      activity(key,a);
      closeModal();
    };
    btns.appendChild(btn);
  });
  const close=document.createElement("button");
  close.className="close";
  close.textContent="CLOSE";
  close.onclick=closeModal;
  btns.appendChild(close);
  modal.style.display="flex";
}
function closeModal(){
  modal.style.display="none";

    y:state.y

  interior.style.display="block";

  state.y=850;

}

function interactFurniture(label){
  const key=state.interior;
  if(key==="home"){
    if(label==="Bed"){
      state.energy=Math.min(100,state.energy+35);
      showToast("You rested in your bedroom.");
    }else if(label==="Fridge"){
      state.energy=Math.min(100,state.energy+15);
      state.money=Math.max(0,state.money-800);
      showToast("You ate at home.");
    }else if(label==="Shower"){
      showToast("You took a shower.");
    }else if(label==="TV"){
      showToast("You are watching TV.");
    }else{
      showToast("You interacted with "+label);
    }
    updateHUD();
    return;
  }
  if(key==="bank" && label==="ATM"){
    showToast("ATM balance: ₦"+state.money.toLocaleString());
    return;
  }
  if(key==="restaurant" && label==="Table"){
    if(state.money>=3000){
      state.money-=3000;
      state.energy=Math.min(100,state.energy+30);
      showToast("You enjoyed your meal.");
    }else showToast("Not enough money.");
    updateHUD();
    return;
  }
  if(key==="gym"){
    state.energy=Math.max(0,state.energy-12);
    state.level++;
    showToast("Workout complete. Level increased.");
    updateHUD();
    return;
  }
  if(key==="salon"){
    state.money=Math.max(0,state.money-5000);
    showToast("Fresh haircut.");
    updateHUD();
    return;
  }
  if(key==="club" && label==="Dance Floor"){
    state.energy=Math.max(0,state.energy-10);
    showToast("You are dancing.");
    updateHUD();
    return;
  }
  if(key==="church"){
    showToast("You spent some quiet time in church.");
    return;
  }
  showToast("You interacted with "+label);
}

/* =========================

========================= */
document.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});
document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});
document.getElementById("runBtn").addEventListener("pointerdown",()=>{
  state.running=true;
});
document.getElementById("runBtn").addEventListener("pointerup",()=>{
  state.running=false;
});
function movement(){
  let dx=0;
  let dy=0;
  if(keys["w"]||keys["arrowup"])dy-=1;
  if(keys["s"]||keys["arrowdown"])dy+=1;
  if(keys["a"]||keys["arrowleft"])dx-=1;
  if(keys["d"]||keys["arrowright"])dx+=1;
  dx+=joystick.x;
  dy+=joystick.y;
  const len=Math.hypot(dx,dy);
  if(len>0){
    dx/=len;
    dy/=len;
    const speed=state.speed*(state.running?1.8:1);
    state.x+=dx*speed;
    state.y+=dy*speed;
    state.energy=Math.max(0,state.energy-.003*(state.running?2:1));
  }
  if(state.gameMode==="outdoor"){
    state.x=Math.max(30,Math.min(3570,state.x));
    state.y=Math.max(30,Math.min(2570,state.y));
  }else{
    state.x=Math.max(45,Math.min(1555,state.x));
    state.y=Math.max(45,Math.min(950,state.y));
  }
}
/* =========================
   JOYSTICK
========================= */
const joystickEl=document.getElementById("joystick");
const stick=document.getElementById("stick");
function joystickMove(clientX,clientY){
  const r=joystickEl.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  let dx=clientX-cx;
  let dy=clientY-cy;
  const max=42;
  const d=Math.hypot(dx,dy);
  if(d>max){
    dx=dx/d*max;
    dy=dy/d*max;
  }
  stick.style.transform=`translate(${dx}px,${dy}px)`;
  joystick.x=dx/max;
  joystick.y=dy/max;
}
function joystickReset(){
  stick.style.transform="translate(0,0)";
  joystick.x=0;
  joystick.y=0;
}
joystickEl.addEventListener("pointerdown",e=>{
  joystickEl.setPointerCapture(e.pointerId);
  joystickMove(e.clientX,e.clientY);
});
joystickEl.addEventListener("pointermove",e=>{
  if(e.pressure>0)joystickMove(e.clientX,e.clientY);
});
joystickEl.addEventListener("pointerup",joystickReset);
joystickEl.addEventListener("pointercancel",joystickReset);

document.getElementById("actBtn").onclick=()=>{
  if(state.gameMode==="interior"){
    if(state.y>820){
      exitBuilding();
    }else{
      showToast("Tap furniture or objects to interact.");
    }
    return;
  }
  let nearest=null;
  let nearestD=9999;
  document.querySelectorAll(".building").forEach(b=>{
    const c=buildingCenter(b);
    const d=Math.hypot(state.x-c.x,state.y-c.y);
    if(d<nearestD){
      nearestD=d;
      nearest=b;
    }
  });
  if(nearest && nearestD<300){
    const key=placeKeyMap[nearest.dataset.place]||nearest.dataset.place;
    openBuilding(key,nearest);
  }else{
    showToast("Walk closer to a building.");
  }
};

function showToast(msg){

/* =========================
   CAMERA
========================= */
function camera(){
  const w=innerWidth;
  const h=innerHeight;
  let targetX=state.x;
  let targetY=state.y;
  let worldWidth=state.gameMode==="outdoor"?3600:1600;
  let worldHeight=state.gameMode==="outdoor"?2600:1000;
  let scale=Math.min(
    w/worldWidth*2.1,
    h/worldHeight*2.1
  );
  scale=Math.max(.55,Math.min(1.25,scale));
  let tx=w/2-targetX*scale;
  let ty=h/2-targetY*scale;
  tx=Math.min(0,Math.max(w-worldWidth*scale,tx));
  ty=Math.min(0,Math.max(h-worldHeight*scale,ty));
  const target=state.gameMode==="outdoor"?world:interior;
  target.style.transform=
    `translate(${tx}px,${ty}px) scale(${scale})`;
  player.style.left=state.x+"px";
  player.style.top=state.y+"px";
}
/* =========================

========================= */
function loop(now){
  const dt=Math.min(40,now-lastTime);
  lastTime=now;
  movement();
  if(state.gameMode==="outdoor"){
    updateNPCs();
  }
  camera();
  updateHUD();
  requestAnimationFrame(loop);
}
