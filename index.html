<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Naija Life</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  background:#08110d;
  color:#fff;
}
button,input,select{
  font:inherit;
}
button{
  border:0;
  cursor:pointer;
}
#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#111;
}
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}
.hidden{
  display:none!important;
}

/* HUD */
#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:10px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:20;
}
.hudBox{
  background:rgba(5,14,11,.78);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:8px 11px;
  backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(0,0,0,.2);
}
.hudTop{
  display:flex;
  gap:7px;
  align-items:center;
  font-size:12px;
}
.money{
  color:#69e39b;
  font-weight:800;
}
#clock{
  font-weight:800;
}
#location{
  opacity:.8;
  font-size:11px;
  margin-top:3px;
}

/* controls */
#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:15px;
  z-index:30;
  pointer-events:none;
}
#joystick{
  position:absolute;
  left:18px;
  bottom:8px;
  width:110px;
  height:110px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  pointer-events:auto;
}
#stick{
  position:absolute;
  width:46px;
  height:46px;
  left:32px;
  top:32px;
  border-radius:50%;
  background:rgba(255,255,255,.22);
}
.actionRow{
  position:absolute;
  right:15px;
  bottom:8px;
  display:flex;
  gap:10px;
}
.controlBtn{
  width:58px;
  height:58px;
  border-radius:50%;
  color:#fff;
  background:rgba(5,14,11,.8);
  border:1px solid rgba(255,255,255,.14);
  font-weight:900;
  pointer-events:auto;
  backdrop-filter:blur(8px);
}
.controlBtn.main{
  width:70px;
  height:70px;
  background:#0a8f54;
}

/* panels */
.panel{
  position:absolute;
  z-index:100;
  inset:0;
  background:rgba(3,8,6,.72);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.card{
  width:min(94vw,620px);
  max-height:92vh;
  overflow:auto;
  background:#101b16;
  border:1px solid rgba(255,255,255,.12);
  border-radius:25px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
  padding:18px;
}
.card h1,.card h2,.card h3{
  margin:0 0 10px;
}
.muted{
  color:#9caea5;
  font-size:13px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.tile{
  background:#17251e;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:12px;
}
.tile strong{
  display:block;
  margin-bottom:5px;
}
.action{
  width:100%;
  padding:12px;
  border-radius:13px;
  background:#0a8f54;
  color:white;
  font-weight:800;
  margin-top:8px;
}
.action.alt{
  background:#25352e;
}
.action.red{
  background:#9c302e;
}
input,select{
  width:100%;
  background:#0b1511;
  color:#fff;
  border:1px solid rgba(255,255,255,.13);
  padding:12px;
  border-radius:12px;
  margin:5px 0 10px;
  outline:none;
}
.row{
  display:flex;
  gap:8px;
}
.row>*{
  flex:1;
}
.close{
  float:right;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#25352e;
  color:#fff;
  font-size:18px;
}
.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:10px;
}
.listItem{
  padding:12px;
  border-radius:14px;
  background:#17251e;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.smallBtn{
  padding:8px 10px;
  border-radius:10px;
  background:#0a8f54;
  color:#fff;
  font-size:12px;
  font-weight:800;
}

/* creator */
#creator{
  z-index:500;
  background:
    radial-gradient(circle at 50% 10%,rgba(13,143,84,.25),transparent 40%),
    #07100c;
}
.avatarPreview{
  width:150px;
  height:180px;
  margin:5px auto 15px;
  display:block;
}
.swatches{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:6px 0 12px;
}
.swatch{
  width:38px;
  height:38px;
  border-radius:50%;
  border:2px solid transparent;
}
.swatch.selected{
  border-color:#fff;
  transform:scale(1.08);
}

/* phone */
#phone{
  z-index:300;
  background:rgba(0,0,0,.65);
}
.phoneShell{
  width:min(92vw,390px);
  height:min(90vh,760px);
  background:#050806;
  border:5px solid #252b28;
  border-radius:38px;
  padding:8px;
  box-shadow:0 25px 100px rgba(0,0,0,.75);
  position:relative;
}
.phoneScreen{
  width:100%;
  height:100%;
  border-radius:29px;
  overflow:hidden;
  background:linear-gradient(160deg,#14251c,#08100c);
  position:relative;
}
.notch{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:110px;
  height:24px;
  background:#050806;
  border-radius:0 0 15px 15px;
  z-index:20;
}
.phoneStatus{
  height:32px;
  padding:9px 14px 0;
  display:flex;
  justify-content:space-between;
  font-size:11px;
}
.phoneContent{
  position:absolute;
  inset:32px 0 55px;
  overflow:auto;
}
.phoneBottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:55px;
  background:rgba(3,8,6,.9);
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.phoneBottom button{
  background:none;
  color:#9aaba2;
  font-size:10px;
}
.phoneBottom button.active{
  color:#fff;
}
.phonePage{
  padding:15px;
}
.phoneHome{
  padding:20px 13px;
}
.phoneTime{
  text-align:center;
  font-size:47px;
  font-weight:200;
  margin-top:20px;
}
.phoneDate{
  text-align:center;
  color:#a9b6af;
}
.appGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px 9px;
  margin-top:25px;
}
.appIcon{
  text-align:center;
  background:none;
  color:#fff;
}
.appIconBox{
  width:55px;
  height:55px;
  margin:auto;
  border-radius:17px;
  display:grid;
  place-items:center;
  background:#20342a;
  border:1px solid rgba(255,255,255,.1);
}
.appIcon svg{
  width:28px;
  height:28px;
}
.appLabel{
  font-size:10px;
  margin-top:5px;
}
.phoneTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.phoneTitle h2{
  margin:0;
}
.backBtn{
  padding:7px 10px;
  border-radius:10px;
  background:#20342a;
  color:#fff;
}
.chat{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.msg{
  max-width:80%;
  padding:9px 11px;
  border-radius:13px;
  background:#1a2921;
  font-size:13px;
}
.msg.me{
  margin-left:auto;
  background:#087746;
}
.chatInput{
  position:absolute;
  bottom:58px;
  left:8px;
  right:8px;
  display:flex;
  gap:5px;
  background:#07100c;
  padding:5px;
}
.chatInput input{
  margin:0;
}
.dead{
  position:absolute;
  inset:0;
  background:#000;
  z-index:99;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.dead h1{
  font-size:35px;
}

/* toast */
#toast{
  position:absolute;
  left:50%;
  bottom:130px;
  transform:translateX(-50%) translateY(20px);
  background:#07100c;
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  padding:11px 15px;
  opacity:0;
  transition:.25s;
  z-index:600;
  pointer-events:none;
  white-space:nowrap;
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* interior */
#interior{
  z-index:80;
  background:#101813;
}
.interiorSvg{
  width:100%;
  height:100%;
}
.interiorActions{
  position:absolute;
  left:15px;
  right:15px;
  bottom:20px;
  display:flex;
  gap:8px;
}
.interiorActions button{
  flex:1;
  padding:13px;
  border-radius:14px;
  background:#0a8f54;
  color:#fff;
  font-weight:800;
}

/* map */
.mapPanel{
  background:#0d1712;
}
.cityMap{
  height:420px;
  border-radius:20px;
  overflow:hidden;
  background:#123022;
  position:relative;
}
.cityRoad{
  position:absolute;
  background:#4b554f;
  border-radius:10px;
}
.cityPoint{
  position:absolute;
  padding:6px 8px;
  border-radius:8px;
  background:#0a8f54;
  font-size:10px;
}

/* stats */
.bar{
  height:8px;
  background:#24342c;
  border-radius:20px;
  overflow:hidden;
  margin:5px 0 10px;
}
.bar i{
  display:block;
  height:100%;
  background:#0a8f54;
}

/* light mode */
body.light .card,
body.light .phoneScreen{
  background:#f4f7f5;
  color:#101713;
}
body.light .tile,
body.light .listItem{
  background:#e6ece8;
}
body.light input,
body.light select{
  background:#fff;
  color:#111;
}
body.light .phoneBottom{
  background:#e7ece9;
}
</style>
</head>

<body>
<div id="game">

<canvas id="world"></canvas>

<div id="hud">
  <div class="hudBox">
    <div class="hudTop">
      <span>₦</span>
      <span class="money" id="money">₦0</span>
      <span>•</span>
      <span id="level">Lv 1</span>
    </div>
    <div id="location">Lagos</div>
  </div>

  <div class="hudBox">
    <div id="clock">--:--</div>
    <div id="weather">Clear</div>
  </div>
</div>

<div id="controls">
  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div class="actionRow">
    <button class="controlBtn" id="mapBtn">MAP</button>
    <button class="controlBtn" id="runBtn">RUN</button>
    <button class="controlBtn main" id="actBtn">ACT</button>
    <button class="controlBtn" id="phoneBtn">PHONE</button>
  </div>
</div>

<div id="toast"></div>

<!-- CHARACTER CREATOR -->
<div class="panel" id="creator">
  <div class="card">
    <h1>Naija Life</h1>
    <p class="muted">Create your character and start your Nigerian life.</p>

    <div id="avatarPreview"></div>

    <label>Name</label>
    <input id="charName" placeholder="Enter your name">

    <div class="row">
      <div>
        <label>City</label>
        <select id="charCity">
          <option>Lagos</option>
          <option>Warri</option>
          <option>Abuja</option>
          <option>Benin City</option>
          <option>Port Harcourt</option>
          <option>Onitsha</option>
          <option>Enugu</option>
          <option>Ibadan</option>
        </select>
      </div>

      <div>
        <label>Gender</label>
        <select id="charGender">
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>
    </div>

    <label>Skin</label>
    <div class="swatches" id="skinSwatches"></div>

    <label>Shirt</label>
    <div class="swatches" id="shirtSwatches"></div>

    <button class="action" id="startGame">START LIFE</button>
  </div>
</div>

<!-- GENERIC PANEL -->
<div class="panel hidden" id="menuPanel">
  <div class="card">
    <button class="close" onclick="closePanel('menuPanel')">×</button>
    <div id="menuContent"></div>
  </div>
</div>

<!-- MAP -->
<div class="panel hidden mapPanel" id="mapPanel">
  <div class="card">
    <button class="close" onclick="closePanel('mapPanel')">×</button>
    <h2>Naija Map</h2>
    <p class="muted">Travel around Nigeria.</p>
    <div class="cityMap" id="cityMap"></div>
    <div class="grid" id="cityButtons"></div>
  </div>
</div>

<!-- INTERIOR -->
<div class="panel hidden" id="interior">
  <div id="interiorGraphic" style="position:absolute;inset:0"></div>
  <div class="interiorActions">
    <button onclick="interiorAction()">USE</button>
    <button onclick="exitBuilding()">EXIT</button>
  </div>
</div>

<!-- PHONE -->
<div class="panel hidden" id="phone">
  <div class="phoneShell">
    <div class="phoneScreen">
      <div class="notch"></div>

      <div class="phoneStatus">
        <span id="phoneTime">--:--</span>
        <span id="phoneBattery">100%</span>
      </div>

      <div class="phoneContent" id="phoneContent"></div>

      <div class="phoneBottom">
        <button id="homePhoneBtn" onclick="phoneHome()">⌂<br>Home</button>
        <button onclick="openPhoneApp('contacts')">♙<br>Contacts</button>
        <button onclick="openPhoneApp('phone')">☎<br>Phone</button>
        <button onclick="openPhoneApp('settings')">⚙<br>Settings</button>
      </div>

      <div class="dead hidden" id="deadPhone">
        <h1>Battery Empty</h1>
        <p>Your phone has died.</p>
        <button class="action" onclick="chargePhone()">CHARGE PHONE</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   NAIJA LIFE
   COMPLETE SINGLE-FILE GAME
========================================================= */

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W*devicePixelRatio;
  canvas.height=H*devicePixelRatio;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",resize);
resize();

/* ---------- SVG ICON ---------- */
function icon(type){
  const icons={
    chat:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 9h8M8 12h5"/>
    </svg>`,
    phone:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M6 3l4 3-2 3c1 3 3 5 6 7l3-2 4 4-3 3C10 20 4 14 3 6l3-3z"/>
    </svg>`,
    map:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 5l6-2 4 2 6-2v16l-6 2-4-2-6 2V5z"/>
      <path d="M10 3v16M14 5v16"/>
    </svg>`,
    bank:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M3 9h18M5 9v8M9 9v8M15 9v8M19 9v8M3 19h18L12 4 3 19z"/>
    </svg>`,
    camera:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 7h4l2-2h4l2 2h4v12H4z"/>
      <circle cx="12" cy="13" r="3"/>
    </svg>`,
    store:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 9l2-5h12l2 5M5 9v10h14V9"/>
      <path d="M4 9c1 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0"/>
    </svg>`,
    gear:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19 13l2 1-2 4-2-1-2 1v2h-5v-2l-2-1-2 1-2-4 2-1v-2l-2-1 2-4 2 1 2-1V4h5v2l2 1 2-1 2 4-2 1z"/>
    </svg>`
  };
  return icons[type]||icons.store;
}

/* ---------- GAME DATA ---------- */

const cities={
  "Lagos":{x:430,y:420,color:"#0a8f54"},
  "Warri":{x:500,y:720,color:"#1486b8"},
  "Abuja":{x:1300,y:280,color:"#a46c25"},
  "Benin City":{x:850,y:590,color:"#8c45a8"},
  "Port Harcourt":{x:760,y:900,color:"#b84c37"},
  "Onitsha":{x:640,y:650,color:"#b38b28"},
  "Enugu":{x:900,y:650,color:"#4f77b5"},
  "Ibadan":{x:300,y:260,color:"#6a963b"}
};

const buildings=[
  {id:"home",name:"Home",type:"home",x:370,y:390,w:190,h:125},
  {id:"bank",name:"Naija Bank",type:"bank",x:670,y:320,w:190,h:125},
  {id:"hospital",name:"Hospital",type:"hospital",x:970,y:320,w:210,h:125},
  {id:"school",name:"School",type:"school",x:1250,y:420,w:210,h:125},
  {id:"market",name:"Market",type:"market",x:700,y:650,w:230,h:135},
  {id:"restaurant",name:"Restaurant",type:"restaurant",x:1000,y:650,w:200,h:125},
  {id:"police",name:"Police Station",type:"police",x:1280,y:690,w:220,h:130},
  {id:"church",name:"Church",type:"church",x:380,y:700,w:210,h:130},
  {id:"shop",name:"Clothing Store",type:"shop",x:1000,y:930,w:210,h:125},
  {id:"club",name:"Night Club",type:"club",x:1290,y:960,w:220,h:130},
  {id:"gym",name:"Gym",type:"gym",x:680,y:980,w:190,h:120},
  {id:"salon",name:"Salon",type:"salon",x:410,y:980,w:190,h:120},
  {id:"fuel",name:"Fuel Station",type:"fuel",x:1200,y:1180,w:250,h:130},
  {id:"hotel",name:"Hotel",type:"hotel",x:820,y:1180,w:220,h:130},
  {id:"work",name:"Office",type:"work",x:460,y:1180,w:220,h:130}
];

const skins=["#6b3e24","#7f4b2d","#925936","#a96b43","#c5865d","#e0a27b"];
const shirts=["#087a49","#174ea6","#9b2c2c","#713f12","#5b21b6","#111827","#f59e0b"];

let player={
  name:"",
  gender:"Male",
  city:"Lagos",
  x:450,
  y:480,
  skin:skins[1],
  shirt:shirts[0],
  money:25000,
  level:1,
  xp:0,
  energy:90,
  hunger:80,
  hygiene:80,
  happiness:75,
  fitness:20,
  reputation:0,
  wanted:0,
  health:100,
  job:null,
  salary:0,
  rent:50000,
  vehicle:null,
  house:"Starter House"
};

let world={
  time:Date.now(),
  weather:"Clear",
  traffic:[],
  cars:[],
  rain:[],
  dayFactor:1
};

let phone={
  battery:100,
  installed:[
    "whatsapp","contacts","phone","maps","bank",
    "camera","store","settings"
  ],
  notifications:3,
  dark:true,
  chats:{
    Tunde:[
      {me:false,text:"Omo, how far?"}
    ],
    Amaka:[
      {me:false,text:"Are you around today?"}
    ],
    Chinedu:[
      {me:false,text:"Let's meet later."}
    ]
  },
  calls:[]
};

let npcNames=[
  "Tunde","Amaka","Chinedu","Aisha","Emeka","Blessing",
  "David","Favour","Kelechi","Peace","Daniel","Ngozi",
  "Uche","Esther","Samuel","Ifeoma","Michael","Rita",
  "Kingsley","Ada"
];

let npcs=[];

function save(){
  localStorage.setItem("naijaLifeSave",JSON.stringify({
    player,phone
  }));
}

function load(){
  try{
    const s=JSON.parse(localStorage.getItem("naijaLifeSave"));
    if(s){
      player=s.player||player;
      phone=s.phone||phone;
      return true;
    }
  }catch(e){}
  return false;
}

/* ---------- CHARACTER ---------- */

function personSVG(p,x=0,y=0,scale=1){
 return `
 <svg class="person" viewBox="0 0 100 150"
      x="${x}" y="${y}" width="${100*scale}" height="${150*scale}">
   <ellipse cx="50" cy="143" rx="28" ry="5" fill="rgba(0,0,0,.22)"/>
   <rect x="27" y="82" width="46" height="46" rx="14" fill="${p.shirt}"/>
   <circle cx="50" cy="50" r="27" fill="${p.skin}"/>
   <path d="M24 48Q27 16 50 17Q76 17 78 48Q69 31 50 32Q33 31 24 48"
         fill="#17130f"/>
   <circle cx="40" cy="51" r="3" fill="#111"/>

/* ---------- NPC ---------- */

function makeNPC(i){
  const skin=skins[i%skins.length];
  const shirt=shirts[(i+2)%shirts.length];
  return {
    id:i,
    name:npcNames[i%npcNames.length],
    x:220+Math.random()*1250,
    y:220+Math.random()*1050,
    skin,
    shirt,
    speed:.4+Math.random()*.55,
    targetX:300+Math.random()*1200,
    targetY:250+Math.random()*1000,
    job:["Office","Market","Hospital","Shop","Restaurant","Driver"][i%6],
    homeX:200+Math.random()*1300,
    homeY:250+Math.random()*1000,
    state:"walking",
    friendship:Math.floor(Math.random()*20)
  };
}

function createNPCs(){
  npcs=[];
  for(let i=0;i<20;i++) npcs.push(makeNPC(i));
}

function updateNPCs(){
  const hour=new Date().getHours();

  npcs.forEach(n=>{
    if(hour>=22 || hour<6){
      n.targetX=n.homeX;
      n.targetY=n.homeY;
      n.state="home";
    }else{
      if(Math.hypot(n.x-n.targetX,n.y-n.targetY)<15){
        n.targetX=220+Math.random()*1300;
        n.targetY=220+Math.random()*1050;
      }
      n.state="walking";
    }

    const dx=n.targetX-n.x;
    const dy=n.targetY-n.y;
    const d=Math.hypot(dx,dy)||1;

    n.x+=(dx/d)*n.speed;
    n.y+=(dy/d)*n.speed;
  });
}

/* ---------- WORLD DRAW ---------- */

function worldTime(){
  return new Date(
    new Date().toLocaleString("en-US",{timeZone:"Africa/Lagos"})
  );
}

function updateClock(){
  const d=worldTime();
  const time=d.toLocaleTimeString("en-NG",{
    hour:"2-digit",
    minute:"2-digit",
    hour12:true
  });
  document.getElementById("clock").textContent=time;
  document.getElementById("phoneTime").textContent=time;

  const h=d.getHours()+d.getMinutes()/60;
  world.dayFactor=(h>=6&&h<18)?1:0;

  if(h>=19 || h<6) world.weather="Night";
  else if(world.weather==="Night") world.weather="Clear";

  document.getElementById("weather").textContent=world.weather;
}

function drawWorld(){
  ctx.clearRect(0,0,W,H);

  const night=world.dayFactor===0;

  ctx.fillStyle=night?"#07100d":"#91c9b2";
  ctx.fillRect(0,0,W,H);

  /* lagoon */
  ctx.fillStyle=night?"#0c2630":"#2386a0";
  ctx.beginPath();
  ctx.moveTo(0,H*.62);
  ctx.lineTo(W,H*.45);
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.fill();

  /* mainland */
  ctx.fillStyle=night?"#111a17":"#7a9b70";
  ctx.fillRect(0,0,W,H*.66);

  /* roads */
  ctx.fillStyle=night?"#252d2a":"#626863";

  ctx.fillRect(0,H*.29,W,65);
  ctx.fillRect(0,H*.51,W,70);
  ctx.fillRect(W*.27,0,70,H*.66);
  ctx.fillRect(W*.67,0,75,H*.66);

  /* road markings */
  ctx.strokeStyle=night?"#676f6b":"#d6d2a8";
  ctx.lineWidth=3;
  ctx.setLineDash([20,18]);

  ctx.beginPath();
  ctx.moveTo(0,H*.32);
  ctx.lineTo(W,H*.32);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,H*.545);
  ctx.lineTo(W,H*.545);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W*.305,0);
  ctx.lineTo(W*.305,H*.66);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W*.705,0);
  ctx.lineTo(W*.705,H*.66);
  ctx.stroke();

  ctx.setLineDash([]);

  /* buildings */
  buildings.forEach(b=>{
    const sx=(b.x-player.x)+W/2;
    const sy=(b.y-player.y)+H/2;

    ctx.fillStyle=night?"#27322d":"#e0d8c7";
    ctx.fillRect(sx,sy,b.w*.45,b.h*.45);

    ctx.fillStyle="#163f2d";
    ctx.fillRect(sx,sy,b.w*.45,16);

    ctx.fillStyle=night?"#a7b9ad":"#ffffff";
    ctx.font="10px Arial";
    ctx.textAlign="center";
    ctx.fillText(b.name,sx+b.w*.225,sy+b.h*.45+13);

    /* windows */
    ctx.fillStyle=night?"#e8b95d":"#8ab8c8";
    for(let xx=10;xx<b.w*.45-5;xx+=27){
      for(let yy=28;yy<b.h*.45-8;yy+=27){
        ctx.fillRect(sx+xx,sy+yy,12,8);
      }
    }
  });

  /* trees */
  for(let i=0;i<28;i++){
    const tx=(i*173%1500-player.x)+W/2;
    const ty=(i*97%850-player.y)+H/2;
    if(tx>-30&&tx<W+30&&ty>-30&&ty<H+30){
      ctx.fillStyle="#174d2e";
      ctx.beginPath();
      ctx.arc(tx,ty,14,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#6c4422";
      ctx.fillRect(tx-3,ty+8,6,18);
    }
  }

  /* NPCs */
  npcs.forEach(n=>{
    const sx=n.x-player.x+W/2;
    const sy=n.y-player.y+H/2;
    if(sx>-80&&sx<W+80&&sy>-100&&sy<H+100){
      drawPersonCanvas(n,sx,sy,.42);
    }
  });

  /* cars */
  world.cars.forEach(c=>{
    c.x+=c.vx;
    c.y+=c.vy;
    if(c.x<0)c.x=1600;
    if(c.x>1600)c.x=0;

    const sx=c.x-player.x+W/2;
    const sy=c.y-player.y+H/2;
    ctx.fillStyle=c.color;
    ctx.fillRect(sx,sy,45,20);
    ctx.fillStyle="#9bd4df";
    ctx.fillRect(sx+8,sy+3,12,8);
    ctx.fillRect(sx+26,sy+3,12,8);
  });

  /* player */
  drawPersonCanvas(player,W/2,H/2,.55);

  /* rain */
  if(world.weather==="Rain"){
    ctx.strokeStyle="rgba(180,210,255,.35)";
    for(let i=0;i<100;i++){
      const x=Math.random()*W;
      const y=Math.random()*H;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-3,y+12);
      ctx.stroke();
    }
  }

  /* night overlay */
  if(night){
    ctx.fillStyle="rgba(2,7,15,.55)";
    ctx.fillRect(0,0,W,H);
  }
}

function drawPersonCanvas(p,x,y,s){
  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath();
  ctx.ellipse(0,25,19*s,5*s,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=p.shirt;
  ctx.fillRect(-13*s,-10*s,26*s,30*s);

  ctx.fillStyle=p.skin;
  ctx.beginPath();
  ctx.arc(0,-24*s,14*s,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#17130f";
  ctx.beginPath();
  ctx.arc(0,-29*s,14*s,Math.PI,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=p.skin;
  ctx.fillRect(-19*s,-5*s,6*s,27*s);
  ctx.fillRect(13*s,-5*s,6*s,27*s);

  ctx.fillStyle="#1a1b1b";
  ctx.fillRect(-10*s,19*s,8*s,17*s);
  ctx.fillRect(2*s,19*s,8*s,17*s);

  ctx.restore();
}

/* ---------- GAME LOOP ---------- */

let keys={};
let joy={x:0,y:0};
let running=false;
let last=performance.now();

function loop(now){
  const dt=Math.min(32,now-last);
  last=now;

  updatePlayer(dt);
  updateNPCs();
  drawWorld();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function updatePlayer(dt){
  let speed=1.5*(running?1.8:1);

  player.x+=joy.x*speed;
  player.y+=joy.y*speed;

  if(keys.ArrowUp||keys.w)player.y-=speed;
  if(keys.ArrowDown||keys.s)player.y+=speed;
  if(keys.ArrowLeft||keys.a)player.x-=speed;
  if(keys.ArrowRight||keys.d)player.x+=speed;

  player.x=Math.max(100,Math.min(1500,player.x));
  player.y=Math.max(100,Math.min(1350,player.y));
}

/* ---------- JOYSTICK ---------- */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyActive=false;

function joystickMove(e){
  const r=joystick.getBoundingClientRect();
  const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const py=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  let dx=px-55;
  let dy=py-55;
  const max=36;
  const d=Math.hypot(dx,dy)||1;
  if(d>max){
    dx=dx/d*max;
    dy=dy/d*max;
  }
  stick.style.left=(55+dx-23)+"px";
  stick.style.top=(55+dy-23)+"px";
  joy.x=dx/max;
  joy.y=dy/max;
}

function joystickEnd(){
  joyActive=false;
  joy.x=0;
  joy.y=0;
  stick.style.left="32px";
  stick.style.top="32px";
}

joystick.addEventListener("touchstart",e=>{
  joyActive=true;
  joystickMove(e);
},{passive:true});
joystick.addEventListener("touchmove",e=>{
  if(joyActive)joystickMove(e);
},{passive:true});
joystick.addEventListener("touchend",joystickEnd);

addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

document.getElementById("runBtn").onclick=()=>{
  running=!running;
  document.getElementById("runBtn").textContent=running?"WALK":"RUN";
};

document.getElementById("actBtn").onclick=action;

function nearestBuilding(){
  let best=null;
  let dist=Infinity;

  buildings.forEach(b=>{
    const cx=b.x+b.w/2;
    const cy=b.y+b.h/2;
    const d=Math.hypot(player.x-cx,player.y-cy);
    if(d<dist){
      dist=d;
      best=b;
    }
  });

  return dist<170?best:null;
}

function nearestNPC(){
  let best=null,dist=Infinity;
  npcs.forEach(n=>{
    const d=Math.hypot(player.x-n.x,player.y-n.y);
    if(d<dist){
      dist=d;
      best=n;
    }
  });
  return dist<100?best:null;
}

function action(){
  const b=nearestBuilding();
  const n=nearestNPC();

  if(b){
    enterBuilding(b);
    return;
  }

  if(n){
    npcInteraction(n);
    return;
  }

  toast("Nothing nearby.");
}

function npcInteraction(n){

    <div class="grid">
      <button class="action" onclick="talkNPC(${n.id})">Talk</button>

function talkNPC(id){

  if(!n)return;
  n.friendship=Math.min(100,n.friendship+5);
  player.happiness=Math.min(100,player.happiness+3);

  toast(`${n.name}: "How far?"`);

}

function messageNPC(id){

  phone.battery=Math.max(0,phone.battery-3);

    name:n.name,

  });

}

function gainXP(amount){
  player.xp+=amount;

  const need=player.level*100;

  if(player.xp>=need){
    player.xp-=need;
    player.level++;
    player.money+=10000;
    player.energy=Math.min(100,player.energy+10);
    toast(`Level up! You are now level ${player.level}.`);
  }

  updateHUD();
  save();
}

function openPhoneChat(name){
  if(!phone.chats[name])phone.chats[name]=[];

  const c=document.getElementById("phoneContent");

  c.innerHTML=`
    <div class="phonePage" style="padding-bottom:70px">
      ${phoneHeader(name)}
      <div class="chat" id="chatMessages">
        ${phone.chats[name].map(m=>`
          <div class="msg ${m.me?"me":""}">${escapeHTML(m.text)}</div>
        `).join("")}
      </div>
    </div>

    <div class="chatInput">
      <input id="chatText" placeholder="Message...">
      <button class="smallBtn" onclick="sendChat('${escapeHTML(name)}')">
        SEND
      </button>
    </div>
  `;

  updatePhone();
}

function sendChat(name){
  const input=document.getElementById("chatText");
  const text=input?.value.trim();
  if(!text)return;

  phone.chats[name].push({me:true,text});
  batteryDrain(1);

  setTimeout(()=>{
    const replies=[
      "Okay, no wahala.",
      "I hear you.",
      "That's nice.",
      "Where are you?",
      "Let's talk later.",
      "Omo, serious?",
      "See you soon."
    ];

    phone.chats[name].push({
      me:false,
      text:replies[Math.floor(Math.random()*replies.length)]
    });

    openPhoneChat(name);
    save();
  },700);

  openPhoneChat(name);
}

function callContact(name){
  batteryDrain(3);
  phone.calls.unshift({
    name,
    time:new Date().toLocaleTimeString(),
    type:"outgoing"
  });
  toast(`Calling ${name}...`);
  save();
}

function orderFood(cost,hunger){
  if(player.money<cost){
    toast("Not enough money.");
    return;
  }

  player.money-=cost;
  player.hunger=Math.min(100,player.hunger+hunger);
  player.energy=Math.min(100,player.energy+5);
  batteryDrain(1);
  updateHUD();
  toast("Food delivered.");
}

function requestRide(){
  batteryDrain(2);
  const cost=2500;

  if(player.money<cost){
    toast("Not enough money.");
    return;
  }

  player.money-=cost;
  player.x+=100;
  player.y+=100;
  toast("Your ride arrived.");
  updateHUD();
}

function installApp(id){
  if(!phone.installed.includes(id)){
    phone.installed.push(id);
    batteryDrain(2);
    save();
    toast(`${appData[id]?.name||id} installed.`);
  }
  renderStore();
}

function uninstallApp(id){
  phone.installed=phone.installed.filter(x=>x!==id);
  save();
  toast("App removed.");
  renderStore();
}

function toggleTheme(){
  phone.dark=!phone.dark;
  document.body.classList.toggle("light",!phone.dark);
  save();

}

function batteryDrain(amount){
  phone.battery=Math.max(0,phone.battery-amount);
  updatePhone();

  if(phone.battery<=0){
    document.getElementById("deadPhone").classList.remove("hidden");
  }

  save();
}

function chargePhone(){
  phone.battery=100;
  document.getElementById("deadPhone").classList.add("hidden");
  save();
  updatePhone();
  toast("Phone charged to 100%.");
}

function updatePhone(){
  document.getElementById("phoneBattery").textContent=
    Math.round(phone.battery)+"%";

  const big=document.getElementById("bigPhoneTime");
  if(big){
    big.textContent=worldTime().toLocaleTimeString("en-NG",{
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    });
  }
}

/* ---------- NEEDS ---------- */

let lastNeeds=Date.now();

function updateNeeds(){
  const now=Date.now();

  if(now-lastNeeds<30000)return;
  lastNeeds=now;

  player.hunger=Math.max(0,player.hunger-1);
  player.energy=Math.max(0,player.energy-1);
  player.hygiene=Math.max(0,player.hygiene-.5);

  if(player.hunger<20){
    player.health=Math.max(0,player.health-1);
  }

  if(player.energy<15){
    player.happiness=Math.max(0,player.happiness-1);
  }

  save();
}

/* ---------- WEATHER ---------- */

let weatherTimer=0;

function randomWeather(){
  const r=Math.random();

  if(r<.08)world.weather="Rain";
  else if(r<.14)world.weather="Storm";
  else if(r<.22)world.weather="Cloudy";
  else world.weather=world.dayFactor?"Clear":"Night";
}

setInterval(randomWeather,120000);

/* ---------- TRAFFIC ---------- */

function createCars(){
  world.cars=[];

  for(let i=0;i<18;i++){
    world.cars.push({
      x:Math.random()*1500,
      y:Math.random()<.5?470:530,
      vx:(Math.random()<.5?-1:1)*(0.5+Math.random()),
      vy:0,
      color:["#d93434","#174ea6","#f0a51a","#eeeeee","#222222"][i%5]
    });
  }
}

/* ---------- DAILY ECONOMY ---------- */

let lastDay=worldTime().getDate();

function dailyUpdate(){
  const d=worldTime();

  if(d.getDate()!==lastDay){
    lastDay=d.getDate();

    if(player.job){
      player.money+=player.salary;
      toast(`Salary received: ₦${player.salary.toLocaleString()}`);
    }

    if(player.money>=player.rent){
      player.money-=player.rent;
    }else{
      player.happiness=Math.max(0,player.happiness-10);
    }

    save();
  }
}

/* ---------- TOAST ---------- */

let toastTimer;

function toast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{
    t.classList.remove("show");
  },2200);
}

/* ---------- ESCAPE ---------- */

function escapeHTML(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

      <div class="tile">
        <strong>Happiness</strong>
        ${Math.round(player.happiness)}%
      </div>

      <div class="tile">
        <strong>Fitness</strong>
        ${Math.round(player.fitness)}%
      </div>
    </div>

    <h3 style="margin-top:18px">Career</h3>

    <div class="tile">
      <strong>${player.job||"Unemployed"}</strong>
      <p class="muted">
        Salary: ₦${player.salary.toLocaleString()}
      </p>
    </div>

    <button class="action" onclick="workShift()">

    </button>

    <button class="action alt" onclick="openJobs()">
      CAREER
    </button>

    <button class="action alt" onclick="openMap()">
      TRAVEL
    </button>
  `);
