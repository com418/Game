<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Naija Life</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#07120f;
  color:white;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.screen{
  position:fixed;
  inset:0;
  display:none;
}

.screen.active{
  display:flex;
}

/* MENU */
#menu{
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 20%,#159463 0,#07120f 45%);
}

.menuBox{
  width:min(92%,430px);
  padding:28px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  background:rgba(7,18,15,.92);
  box-shadow:0 25px 80px #0008;
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:-2px;
}

.sub{
  opacity:.65;
  margin:7px 0 25px;
}

.cityBtn{
  width:100%;
  margin:8px 0;
  padding:18px;
  border-radius:17px;
  color:white;
  background:#0d6f4c;
  font-weight:800;
}

.cityBtn:active{
  transform:scale(.98);
}

/* CREATOR */
#creator{
  align-items:center;
  justify-content:center;
  background:#08140f;
}

.creatorBox{
  width:min(94%,480px);
  max-height:94vh;
  overflow:auto;
  padding:22px;
  border-radius:25px;
  background:#102019;
}

.preview{
  height:220px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:20px;
  background:#07110d;
  margin-bottom:15px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-size:13px;
  opacity:.7;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ffffff18;
  border-radius:12px;
  outline:none;
  color:white;
  background:#07130f;
}

.primary{
  width:100%;
  margin-top:16px;
  padding:15px;
  border-radius:14px;
  color:white;
  background:#0b8b5d;
  font-weight:800;
}

/* GAME */
#game{
  display:none;
  background:#080d0b;
}

#world{
  position:absolute;
  width:3000px;
  height:2200px;
  overflow:hidden;
  background:
    linear-gradient(#b8d69d 0 100%);
}

.road{
  position:absolute;
  background:#373c3b;
}

.road.h{
  width:3000px;
  height:105px;
}

.road.v{
  width:105px;
  height:2200px;
}

.roadLine{
  position:absolute;
  background:#d8bd58;
}

.building{
  position:absolute;
  width:170px;
  height:130px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 20px #0003;
}

.building svg{
  width:100%;
  height:100%;
}

#player,
.npc{
  position:absolute;
  width:70px;
  height:100px;
  transform-origin:center bottom;
  z-index:20;
}

.npc{
  transition:transform .4s linear;
}

.shadow{
  fill:#0003;
}

/* HUD */
#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:100;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hudLeft,.hudRight{
  display:flex;
  gap:7px;
  pointer-events:auto;
}

.hudCard{
  padding:9px 12px;
  border-radius:13px;
  background:#07130ed9;
  border:1px solid #ffffff15;
  backdrop-filter:blur(10px);
  font-size:12px;
}

.hudButton{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:14px;
  color:white;
  background:#07130ed9;
  border:1px solid #ffffff15;
}

.hudButton svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}

/* CLOCK */
#clock{
  position:fixed;
  top:67px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  padding:7px 12px;
  border-radius:12px;
  background:#07130ed9;
  font-size:12px;
}

/* ACTION */
#action{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  z-index:100;
  padding:13px 22px;
  border-radius:16px;
  color:white;
  background:#0b8b5d;
  display:none;
  font-weight:800;
}

/* JOYSTICK */
#joystick{
  position:fixed;
  bottom:25px;
  left:20px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:#07130e99;
  border:1px solid #ffffff15;
  z-index:100;
  touch-action:none;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#0b8b5d;
  left:35px;
  top:35px;
}

/* PHONE */
#phone{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:#0008;
}

#phone.active{
  display:flex;
}

.phoneShell{
  width:min(100%,430px);
  height:min(88vh,760px);
  border-radius:30px 30px 0 0;
  overflow:hidden;
  background:#101714;
  box-shadow:0 -20px 80px #0009;
  display:flex;
  flex-direction:column;
}

.phoneTop{
  padding:17px;
  background:#0b8b5d;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.phoneTitle{
  font-size:20px;
  font-weight:900;
}

.phoneContent{
  flex:1;
  overflow:auto;
  padding:15px;
}

.phoneNav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #ffffff12;
  background:#0b110f;
}

.phoneNav button{
  padding:13px 5px;
  color:#aebbb6;
  background:none;
  font-size:11px;
}

.phoneNav button.active{
  color:#50d99f;
}

.phoneNav svg{
  width:20px;
  height:20px;
  display:block;
  margin:auto auto 4px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}

.phoneClose{
  color:white;
  background:#ffffff18;
  border-radius:10px;
  padding:7px 10px;
}

/* CONTACTS */
.contact{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin-bottom:8px;
  border-radius:16px;
  background:#17211d;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#0b8b5d;
  font-weight:900;
}

.contactMain{
  flex:1;
}

.contactName{
  font-weight:800;
}

.contactStatus{
  margin-top:4px;
  font-size:11px;
  opacity:.55;
}

.smallBtn{
  padding:9px 11px;
  border-radius:10px;
  color:white;
  background:#0b8b5d;
  font-size:11px;
}

/* CHAT */
.chatHeader{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.backBtn{
  color:white;
  background:#ffffff10;
  padding:9px 12px;
  border-radius:10px;
}

.messages{
  min-height:350px;
}

.msg{
  max-width:78%;
  padding:10px 12px;
  border-radius:15px;
  margin:7px 0;
  font-size:13px;
  line-height:1.35;
}

.msg.you{
  margin-left:auto;
  background:#0b8b5d;
  border-bottom-right-radius:4px;
}

.msg.friend{
  background:#202a26;
  border-bottom-left-radius:4px;
}

.chatInput{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.chatInput input{
  flex:1;
}

.send{
  width:48px;
  border-radius:12px;
  background:#0b8b5d;
  color:white;
}

/* CALL */
#callOverlay{
  position:fixed;
  inset:0;
  z-index:700;
  display:none;
  align-items:center;
  justify-content:center;
  background:#06120ddd;
}

#callOverlay.active{
  display:flex;
}

.callBox{
  width:90%;
  max-width:350px;
  text-align:center;
  padding:30px;
  border-radius:28px;
  background:#102019;
}

.callAvatar{
  width:90px;
  height:90px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#0b8b5d;
  font-size:30px;
  font-weight:900;
}

.callName{
  margin-top:17px;
  font-size:24px;
  font-weight:900;
}

.callState{
  margin-top:7px;
  opacity:.65;
}

.callButtons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:28px;
}

.callButton{
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:white;
  background:#202b26;
}

.callButton.end{
  background:#c93636;
}

.callButton svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}

/* LOCATION MODAL */
#locationModal{
  position:fixed;
  inset:0;
  z-index:450;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:#0007;
}

#locationModal.active{
  display:flex;
}

.locationBox{
  width:min(100%,430px);
  padding:20px;
  border-radius:28px 28px 0 0;
  background:#102019;
}

.locationTitle{
  font-size:22px;
  font-weight:900;
}

.locationDescription{
  margin:7px 0 15px;
  opacity:.65;
  font-size:13px;
}

.locationActions{
  display:grid;
  gap:8px;
}

.locationActions button{
  padding:14px;
  border-radius:13px;
  color:white;
  background:#173029;
  text-align:left;
}

.locationActions button.primaryAction{
  background:#0b8b5d;
}

/* TOAST */
#toast{
  position:fixed;
  left:50%;
  bottom:165px;
  transform:translateX(-50%) translateY(20px);
  z-index:900;
  padding:12px 17px;
  border-radius:13px;
  background:#07130ef2;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-size:12px;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* NIGHT */
#night{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
  background:#061329;
  opacity:0;
  transition:opacity 1s;
  mix-blend-mode:multiply;
}

/* MOBILE */
@media(max-width:500px){
  .hudCard{
    font-size:11px;
    padding:8px;
  }

  .logo{
    font-size:36px;
  }
}
</style>
</head>

<body>

<!-- MENU -->
<section id="menu" class="screen active">
  <div class="menuBox">
    <div class="logo">NAIJA LIFE</div>
    <div class="sub">Your life. Your city. Your choices.</div>

    <button class="cityBtn" onclick="chooseCity('Lagos')">
      ENTER LAGOS
    </button>

    <button class="cityBtn" onclick="chooseCity('Warri')">
      ENTER WARRI
    </button>
  </div>
</section>

<!-- CHARACTER CREATOR -->
<section id="creator" class="screen">
  <div class="creatorBox">

    <h2>Create Your Character</h2>

    <div class="preview">
      <svg id="creatorPreview"
           viewBox="0 0 100 140"
           width="130"
           height="180"></svg>
    </div>

    <label>Name</label>
    <input id="charName" maxlength="18" placeholder="Your name">

    <label>Skin</label>
    <select id="charSkin">
      <option value="#6b422d">Deep Brown</option>
      <option value="#8b5a3c">Brown</option>
      <option value="#a86f4c">Warm Brown</option>
      <option value="#c58a62">Light Brown</option>
    </select>

    <label>Hair</label>
    <select id="charHair">
      <option value="#17120f">Black</option>
      <option value="#3b2418">Dark Brown</option>
      <option value="#5a321e">Brown</option>
    </select>

    <label>Shirt</label>
    <select id="charShirt">
      <option value="#0b8b5d">Green</option>
      <option value="#2764d8">Blue</option>
      <option value="#c83b3b">Red</option>
      <option value="#eeeeee">White</option>
      <option value="#171717">Black</option>
    </select>

    <label>Pants</label>
    <select id="charPants">
      <option value="#20252a">Black</option>
      <option value="#315b91">Denim</option>
      <option value="#6d482d">Brown</option>
      <option value="#d0c5a8">Light</option>
    </select>

    <button class="primary" onclick="startGame()">
      ENTER CITY
    </button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">

  <div id="world">

    <!-- ROADS -->
    <div class="road h" style="top:550px"></div>
    <div class="road h" style="top:1450px"></div>
    <div class="road v" style="left:700px"></div>
    <div class="road v" style="left:2050px"></div>

    <div class="roadLine"
         style="top:599px;left:0;width:3000px;height:5px"></div>

    <div class="roadLine"
         style="top:1499px;left:0;width:3000px;height:5px"></div>

    <div class="roadLine"
         style="top:0;left:750px;width:5px;height:2200px"></div>

    <div class="roadLine"
         style="top:0;left:2100px;width:5px;height:2200px"></div>

    <!-- LOCATIONS -->

    <div class="building"
         data-location="Home"
         style="left:270px;top:250px"
         onclick="openLocation('Home')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#d7a46d"/>
        <path d="M20 65 L85 15 L150 65" fill="#9e3f32"/>
        <rect x="45" y="65" width="80" height="60" fill="#f0d0a2"/>
        <rect x="75" y="88" width="20" height="37" fill="#70472d"/>
        <rect x="53" y="75" width="15" height="15" fill="#8fd1dc"/>
        <rect x="102" y="75" width="15" height="15" fill="#8fd1dc"/>
      </svg>
    </div>

    <div class="building"
         data-location="Bank"
         style="left:870px;top:250px"
         onclick="openLocation('Bank')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#edf4ef"/>
        <path d="M20 45 L85 12 L150 45 Z" fill="#0b8b5d"/>
        <g fill="#0b8b5d">
          <rect x="32" y="52" width="15" height="60"/>
          <rect x="60" y="52" width="15" height="60"/>
          <rect x="88" y="52" width="15" height="60"/>
          <rect x="116" y="52" width="15" height="60"/>
        </g>
        <rect x="20" y="112" width="130" height="8" fill="#15352a"/>
      </svg>
    </div>

    <div class="building"
         data-location="Market"
         style="left:1110px;top:690px"
         onclick="openLocation('Market')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#e8d09d"/>
        <path d="M0 45 Q20 20 40 45 Q60 20 80 45 Q100 20 120 45 Q140 20 170 45 V70 H0Z"
              fill="#c64a3b"/>
        <rect x="25" y="72" width="120" height="48" fill="#7b4b2c"/>
        <circle cx="50" cy="88" r="8" fill="#e54d42"/>
        <circle cx="75" cy="88" r="8" fill="#edb52f"/>
        <circle cx="100" cy="88" r="8" fill="#62a84f"/>
      </svg>
    </div>

    <div class="building"
         data-location="Restaurant"
         style="left:1670px;top:700px"
         onclick="openLocation('Restaurant')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#d05a43"/>
        <rect x="15" y="15" width="140" height="30" rx="5" fill="#fff1db"/>
        <rect x="35" y="62" width="100" height="50" rx="8" fill="#633c2d"/>
        <circle cx="60" cy="87" r="9" fill="#e3b95f"/>
        <circle cx="110" cy="87" r="9" fill="#e3b95f"/>
      </svg>
    </div>

    <div class="building"
         data-location="Work"
         style="left:2350px;top:250px"
         onclick="openLocation('Work')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#66747d"/>
        <rect x="20" y="15" width="130" height="100" fill="#a8c4cf"/>
        <g fill="#526a73">
          <rect x="30" y="25" width="25" height="20"/>
          <rect x="70" y="25" width="25" height="20"/>
          <rect x="110" y="25" width="25" height="20"/>
          <rect x="30" y="55" width="25" height="20"/>
          <rect x="70" y="55" width="25" height="20"/>
          <rect x="110" y="55" width="25" height="20"/>
        </g>
      </svg>
    </div>

    <div class="building"
         data-location="Church"
         style="left:280px;top:800px"
         onclick="openLocation('Church')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#dcdcdc"/>
        <path d="M85 5 L95 25 H110 V35 H95 L85 55 L75 35 H60 V25 H75Z"
              fill="#b99c50"/>
        <path d="M25 55 L85 20 L145 55 V120 H25Z" fill="#eee"/>
        <rect x="70" y="78" width="30" height="42" fill="#75513c"/>
        <circle cx="50" cy="70" r="10" fill="#8fcbd2"/>
        <circle cx="120" cy="70" r="10" fill="#8fcbd2"/>
      </svg>
    </div>

    <div class="building"
         data-location="Club"
         style="left:2150px;top:800px"
         onclick="openLocation('Club')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#21142f"/>
        <circle cx="45" cy="55" r="30" fill="#7b3fb2"/>
        <circle cx="125" cy="55" r="30" fill="#c43c80"/>
        <rect x="25" y="90" width="120" height="25" rx="8" fill="#111"/>
      </svg>
    </div>

    <div class="building"
         data-location="Hospital"
         style="left:850px;top:1250px"
         onclick="openLocation('Hospital')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#edf4f5"/>
        <rect x="67" y="22" width="36" height="75" fill="#dcebed"/>
        <rect x="47" y="42" width="76" height="35" fill="#dcebed"/>
        <path d="M76 29 H94 V48 H113 V66 H94 V86 H76 V66 H57 V48 H76Z"
              fill="#c73838"/>
      </svg>
    </div>

    <div class="building"
         data-location="Gym"
         style="left:1500px;top:1300px"
         onclick="openLocation('Gym')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#4d5960"/>
        <rect x="25" y="20" width="120" height="80" fill="#263237"/>
        <path d="M48 70 H122" stroke="#e5e5e5" stroke-width="7"/>
        <path d="M40 52 V88 M130 52 V88"
              stroke="#e5e5e5" stroke-width="10"/>
      </svg>
    </div>

    <div class="building"
         data-location="Salon"
         style="left:2250px;top:1300px"
         onclick="openLocation('Salon')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#d18bb0"/>
        <circle cx="85" cy="52" r="27" fill="#8b5a3c"/>
        <path d="M52 48 Q85 8 118 48" fill="#20150f"/>
        <rect x="48" y="88" width="74" height="20" rx="5" fill="#fff"/>
      </svg>
    </div>

    <div class="building"
         data-location="Fuel"
         style="left:350px;top:1700px"
         onclick="openLocation('Fuel')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#e9e0c9"/>
        <rect x="25" y="25" width="120" height="75" fill="#c53e34"/>
        <rect x="45" y="40" width="30" height="25" fill="#e5e5e5"/>
        <rect x="95" y="40" width="30" height="25" fill="#e5e5e5"/>
        <rect x="70" y="70" width="30" height="30" fill="#e5e5e5"/>
      </svg>
    </div>

    <div class="building"
         data-location="Police"
         style="left:1300px;top:1740px"
         onclick="openLocation('Police')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#5479a0"/>
        <rect x="25" y="25" width="120" height="90" fill="#dbe6ef"/>
        <path d="M85 25 L110 40 L105 65 Q85 82 65 65 L60 40Z"
              fill="#5479a0"/>
        <circle cx="85" cy="48" r="8" fill="#fff"/>
      </svg>
    </div>

    <div class="building"
         data-location="School"
         style="left:2000px;top:1740px"
         onclick="openLocation('School')">
      <svg viewBox="0 0 170 130">
        <rect width="170" height="130" fill="#d9b86d"/>
        <path d="M20 45 L85 15 L150 45Z" fill="#a44938"/>
        <rect x="35" y="50" width="100" height="65" fill="#f1dfad"/>
        <rect x="72" y="78" width="25" height="37" fill="#73503a"/>
        <g fill="#78aab2">
          <rect x="45" y="62" width="15" height="15"/>
          <rect x="108" y="62" width="15" height="15"/>
        </g>
      </svg>
    </div>

    <!-- PLAYER -->
    <div id="player">
      <svg viewBox="0 0 70 100">
        <ellipse class="shadow" cx="35" cy="95" rx="23" ry="5"/>
        <circle id="pHead" cx="35" cy="25" r="16" fill="#8b5a3c"/>
        <path id="pHair"

<script>
/* =========================================================

========================================================= */

const SAVE_KEY = "naijaLifeSaveV4";

const defaultCharacter = {

    location:"Home",

    messages:[
      {

  },

    location:"Club",

let state = JSON.parse(localStorage.getItem(SAVE_KEY)) || {

  xp:0,

if(!state.friends){

}

let selectedFriend=null;
let currentPhonePage="home";
let currentLocation=null;
let callTimer=null;
let callSeconds=0;
let muted=false;

/* =========================
   BASIC HELPERS
========================= */

function save(){
  localStorage.setItem(SAVE_KEY,JSON.stringify(state));
}

function toast(text){
  const el=document.getElementById("toast");
  el.textContent=text;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function money(){
  document.getElementById("money").textContent=
    "₦"+Number(state.money).toLocaleString();
}

function updateHUD(){
  money();

  document.getElementById("energy").textContent=
    "Energy "+Math.round(state.energy);

  document.getElementById("level").textContent=
    "Lv "+state.level;
}

function addXP(amount){
  state.xp+=amount;

  while(state.xp>=100){
    state.xp-=100;
    state.level++;
    toast("Level up! You are now level "+state.level);
  }

  save();
  updateHUD();
}

/* =========================
   CITY
========================= */

function chooseCity(city){
  state.city=city;

  document.getElementById("menu").classList.remove("active");
  document.getElementById("creator").classList.add("active");

  loadCreator();
}

function loadCreator(){
  document.getElementById("charName").value=
    state.character.name;

  document.getElementById("charSkin").value=
    state.character.skin;

  document.getElementById("charHair").value=
    state.character.hair;

  document.getElementById("charShirt").value=
    state.character.shirt;

  document.getElementById("charPants").value=
    state.character.pants;

  updateCreatorPreview();
}

    <path d="M67 52 L82 79 L75 82 L61 61Z"
          fill="${skin}"/>
  `;
}

[
  "charName",
  "charSkin",
  "charHair",
  "charShirt",
  "charPants"
].forEach(id=>{
  document.getElementById(id)
    .addEventListener("input",updateCreatorPreview);
  document.getElementById(id)
    .addEventListener("change",updateCreatorPreview);
});

function startGame(){

  state.character={
    name:document.getElementById("charName").value.trim()
      || "Maro",
    skin:document.getElementById("charSkin").value,
    hair:document.getElementById("charHair").value,
    shirt:document.getElementById("charShirt").value,
    pants:document.getElementById("charPants").value
  };

  save();

  document.getElementById("creator").classList.remove("active");
  document.getElementById("game").style.display="block";

  updatePlayerSVG();
  updateHUD();
  updateClock();

  toast(
    "Welcome to "+state.city+", "+state.character.name
  );
}

function openCreatorEdit(){
  document.getElementById("game").style.display="none";
  document.getElementById("creator").classList.add("active");
  loadCreator();
}

/* =========================
   PLAYER
========================= */

function updatePlayerSVG(){

  document.getElementById("pHead")
    .setAttribute("fill",state.character.skin);

  document.getElementById("pHair")
    .setAttribute("fill",state.character.hair);

  document.getElementById("pShirt")
    .setAttribute("fill",state.character.shirt);

  document.getElementById("pLeftArm")
    .setAttribute("fill",state.character.skin);

  document.getElementById("pRightArm")
    .setAttribute("fill",state.character.skin);

  document.getElementById("pLeftLeg")
    .setAttribute("fill",state.character.pants);

  document.getElementById("pRightLeg")
    .setAttribute("fill",state.character.pants);
}

/* =========================
   REAL NIGERIAN TIME
========================= */

function nigeriaDate(){

  return new Date(
    new Date().toLocaleString(
      "en-US",
      {timeZone:"Africa/Lagos"}
    )
  );
}

function updateClock(){

  const d=nigeriaDate();

  let h=d.getHours();
  const m=d.getMinutes().toString().padStart(2,"0");
  const s=d.getSeconds().toString().padStart(2,"0");

  const suffix=h>=12?"PM":"AM";

  let hh=h%12;
  if(hh===0) hh=12;

  document.getElementById("clock").textContent=
    `${hh}:${m}:${s} ${suffix} • ${state.city}`;

  let nightOpacity=0;

  if(h>=20 || h<5){
    nightOpacity=.62;
  }else if(h>=18){
    nightOpacity=.25;
  }else if(h<7){
    nightOpacity=.12;
  }

  document.getElementById("night")
    .style.opacity=nightOpacity;

  updateFriendSchedules(d);
}

setInterval(updateClock,1000);

/* =========================
   FRIEND SCHEDULES
========================= */

function updateFriendSchedules(d){

  const h=d.getHours();

  state.friends.forEach(friend=>{

    if(h>=8 && h<17){
      friend.location="Work";
    }else if(h>=17 && h<19){
      friend.location="Restaurant";
    }else if(h>=20 && h<24){
      friend.location="Club";
    }else{
      friend.location="Home";
    }

    if(d.getDay()===0 && h>=8 && h<13){
      friend.location="Church";
    }
  });
}

/* =========================
   PHONE
========================= */

function openPhone(){
  document.getElementById("phone").classList.add("active");
  phonePage("home");
}

function closePhone(){
  document.getElementById("phone").classList.remove("active");
}

function phonePage(page){

  currentPhonePage=page;

  document.querySelectorAll(".phoneNav button")
    .forEach(b=>b.classList.remove("active"));

  const nav={
    home:"navHome",
    friends:"navFriends",
    messages:"navMessages",
    calls:"navCalls"
  };

  document.getElementById(nav[page])
    .classList.add("active");

  if(page==="home") renderPhoneHome();
  if(page==="friends") renderFriends();
  if(page==="messages") renderMessages();
  if(page==="calls") renderCalls();
}

function renderPhoneHome(){

  const d=nigeriaDate();

  document.getElementById("phoneContent").innerHTML=`
    <h2>Good ${d.getHours()<12?"morning":
               d.getHours()<18?"afternoon":"evening"},
        ${escapeHTML(state.character.name)}</h2>

    <p style="opacity:.6;font-size:13px">
      ${state.city} • Your phone is connected to your life.
    </p>

    <div class="contact">
      <div class="avatar">₦</div>
      <div class="contactMain">
        <div class="contactName">Wallet</div>
        <div class="contactStatus">
          ₦${Number(state.money).toLocaleString()}
        </div>
      </div>
    </div>

    <div class="contact">
      <div class="avatar">F</div>
      <div class="contactMain">
        <div class="contactName">Friends</div>
        <div class="contactStatus">
          ${state.friends.length} contacts
        </div>
      </div>
      <button class="smallBtn"
              onclick="phonePage('friends')">
        Open
      </button>
    </div>

    <div class="contact">
      <div class="avatar">M</div>
      <div class="contactMain">
        <div class="contactName">Messages</div>
        <div class="contactStatus">
          Chat with your friends
        </div>
      </div>
      <button class="smallBtn"
              onclick="phonePage('messages')">
        Open
      </button>
    </div>

    <div class="contact">
      <div class="avatar">C</div>
      <div class="contactMain">
        <div class="contactName">Calls</div>
        <div class="contactStatus">
          Call history
        </div>
      </div>
      <button class="smallBtn"
              onclick="phonePage('calls')">
        Open
      </button>
    </div>
  `;
}

function renderFriends(){

  let html=`<h2>Friends</h2>`;

  state.friends.forEach(friend=>{

    html+=`
      <div class="contact">

        <div class="avatar">${friend.avatar}</div>

        <div class="contactMain">
          <div class="contactName">
            ${escapeHTML(friend.name)}
          </div>

          <div class="contactStatus">
            ${escapeHTML(friend.location)}
            • Friendship ${friend.relationship}%
          </div>
        </div>

        <button class="smallBtn"
                onclick="openFriend('${friend.id}')">
          View
        </button>

      </div>
    `;
  });

  document.getElementById("phoneContent").innerHTML=html;
}

function openFriend(id){

  selectedFriend=state.friends.find(f=>f.id===id);

  if(!selectedFriend) return;

  document.getElementById("phoneContent").innerHTML=`

    <div class="chatHeader">

      <button class="backBtn"
              onclick="phonePage('friends')">
        Back
      </button>

      <div>
        <strong>${escapeHTML(selectedFriend.name)}</strong>
        <div style="font-size:11px;opacity:.55">
          ${escapeHTML(selectedFriend.location)}
        </div>
      </div>

    </div>

    <button class="smallBtn"
            onclick="startCall('${selectedFriend.id}')">
      Call ${escapeHTML(selectedFriend.name)}
    </button>

    <button class="smallBtn"
            onclick="inviteFriend('${selectedFriend.id}')">
      Invite to meet
    </button>

    <div class="messages"
         id="messagesBox">
      ${renderMessageHTML(selectedFriend)}
    </div>

    <div class="chatInput">
      <input id="messageInput"
             placeholder="Type a message..."
             maxlength="150"
             onkeydown="if(event.key==='Enter')sendMessage()">

      <button class="send"
              onclick="sendMessage()">
        Send
      </button>
    </div>
  `;
}

function renderMessageHTML(friend){

  return friend.messages.map(m=>`
    <div class="msg ${m.from==="you"?"you":"friend"}">
      ${escapeHTML(m.text)}
    </div>
  `).join("");
}

function sendMessage(){

  if(!selectedFriend) return;

  const input=document.getElementById("messageInput");

  if(!input) return;

  const text=input.value.trim();

  if(!text) return;

  selectedFriend.messages.push({
    from:"you",
    text:text
  });

  selectedFriend.relationship=
    Math.min(100,selectedFriend.relationship+1);

  save();

  input.value="";

  openFriend(selectedFriend.id);

  setTimeout(()=>{
    friendReply(selectedFriend.id,text);
  },900);
}

/* =========================
   SMART FRIEND REPLIES
========================= */

function friendReply(id,text){

  const friend=state.friends.find(f=>f.id===id);

  if(!friend) return;

  const lower=text.toLowerCase();

  let reply="Nice one bro.";

  if(
    lower.includes("where") ||
    lower.includes("dey") ||
    lower.includes("where are")
  ){
    reply=`I dey ${friend.location.toLowerCase()} now.`;
  }
  else if(
    lower.includes("club") ||
    lower.includes("tonight")
  ){
    reply="Sure. We fit link up tonight.";
  }
  else if(
    lower.includes("church")
  ){
    reply="Okay. I fit meet you there.";
  }
  else if(
    lower.includes("restaurant") ||
    lower.includes("food")
  ){
    reply="Food sounds good. Make we go.";
  }
  else if(
    lower.includes("love") ||
    lower.includes("miss")
  ){
    reply="Aww, that's nice to hear.";
  }
  else if(
    lower.includes("hello") ||
    lower.includes("hi")
  ){
    reply="Hey! Good to hear from you.";
  }
  else{
    const replies=[
      "Yeah, I understand.",
      "No wahala.",
      "That sounds good.",
      "Okay, I hear you.",
      "We go sort am out.",
      "Definitely."
    ];

    reply=replies[
      Math.floor(Math.random()*replies.length)
    ];
  }

  friend.messages.push({
    from:"friend",
    text:reply
  });

  save();

  if(
    currentPhonePage==="friends" &&
    selectedFriend &&
    selectedFriend.id===id
  ){
    openFriend(id);
  }
}

/* =========================
   MESSAGE LIST
========================= */

function renderMessages(){

  let html=`<h2>Messages</h2>`;

  state.friends.forEach(friend=>{

    const last=
      friend.messages[friend.messages.length-1];

    html+=`
      <div class="contact"
           onclick="openFriend('${friend.id}')">

        <div class="avatar">${friend.avatar}</div>

        <div class="contactMain">
          <div class="contactName">
            ${escapeHTML(friend.name)}
          </div>

          <div class="contactStatus">
            ${escapeHTML(last?.text || "No messages")}
          </div>
        </div>

      </div>
    `;
  });

  document.getElementById("phoneContent").innerHTML=html;
}

/* =========================
   CALLING
========================= */

function startCall(id){

  const friend=state.friends.find(f=>f.id===id);

  if(!friend) return;

  closePhone();

  document.getElementById("callOverlay")
    .classList.add("active");

  document.getElementById("callAvatar")
    .textContent=friend.avatar;

  document.getElementById("callName")
    .textContent=friend.name;

  document.getElementById("callState")
    .textContent="Calling...";

  callSeconds=0;
  muted=false;

  clearInterval(callTimer);

  setTimeout(()=>{
    if(
      document.getElementById("callOverlay")
        .classList.contains("active")
    ){
      document.getElementById("callState")
        .textContent="Connected";

      callTimer=setInterval(()=>{
        callSeconds++;

        const min=Math.floor(callSeconds/60);
        const sec=(callSeconds%60)
          .toString()
          .padStart(2,"0");

        document.getElementById("callState")
          .textContent=
          `Connected • ${min}:${sec}`;
      },1000);
    }
  },1200);
}

function toggleMute(){

  muted=!muted;

  toast(muted ? "Microphone muted" : "Microphone on");
}

function endCall(){

  clearInterval(callTimer);

  const name=
    document.getElementById("callName").textContent;

  state.callHistory.unshift({
    name:name,
    duration:callSeconds,
    time:new Date().toISOString()
  });

  state.callHistory=
    state.callHistory.slice(0,30);

  save();

  document.getElementById("callOverlay")
    .classList.remove("active");

  toast("Call ended");

  callSeconds=0;
}

function renderCalls(){

  let html=`<h2>Calls</h2>`;

  if(!state.callHistory.length){

    html+=`
      <p style="opacity:.55">
        No calls yet.
      </p>
    `;

  }else{

    state.callHistory.forEach(call=>{

      const min=Math.floor(call.duration/60);
      const sec=(call.duration%60)
        .toString()
        .padStart(2,"0");

      html+=`
        <div class="contact">

          <div class="avatar">↗</div>

          <div class="contactMain">
            <div class="contactName">
              ${escapeHTML(call.name)}
            </div>

            <div class="contactStatus">
              ${min}:${sec}
            </div>
          </div>

        </div>
      `;
    });
  }

  document.getElementById("phoneContent").innerHTML=html;
}

/* =========================
   INVITE FRIEND
========================= */

function inviteFriend(id){

  const friend=state.friends.find(f=>f.id===id);

  if(!friend) return;

  const places=[
    "Restaurant",
    "Club",
    "Park",
    "Market"
  ];

  const place=places[
    Math.floor(Math.random()*places.length)
  ];

  friend.messages.push({
    from:"friend",
    text:`Sure! Let's meet at the ${place.toLowerCase()}.`
  });

  friend.relationship=
    Math.min(100,friend.relationship+3);

function openLocation(name){

  currentLocation=name;

  const loc=locations[name];

  if(!loc) return;

  document.getElementById("locationTitle")
    .textContent=name;

  document.getElementById("locationDescription")
    .textContent=loc.description;

  const box=document.getElementById("locationActions");

  box.innerHTML="";

  loc.actions.forEach(action=>{

    const btn=document.createElement("button");

    btn.textContent=action[0];

    if(
      action[1]==="workShift" ||
      action[1]==="churchService" ||
      action[1]==="clubEnter"
    ){
      btn.classList.add("primaryAction");
    }

    btn.onclick=()=>{
      window[action[1]]();
    };

    box.appendChild(btn);
  });

  document.getElementById("locationModal")
    .classList.add("active");
}

function closeLocation(){
  document.getElementById("locationModal")
    .classList.remove("active");
}

/* =========================
   SIMPLE MOVEMENT
========================= */

let keys={
  up:false,
  down:false,
  left:false,
  right:false
};

let joystick={
  active:false,
  x:0,
  y:0
};

const speed=2.5;

function movePlayer(){

  let dx=0;
  let dy=0;

  if(keys.up)dy-=1;
  if(keys.down)dy+=1;
  if(keys.left)dx-=1;
  if(keys.right)dx+=1;

  if(joystick.active){
    dx+=joystick.x;
    dy+=joystick.y;
  }

  const len=Math.hypot(dx,dy);

  if(len>0){

    dx/=len;
    dy/=len;

    state.x+=dx*speed;
    state.y+=dy*speed;

    state.x=Math.max(20,Math.min(2930,state.x));
    state.y=Math.max(20,Math.min(2130,state.y));

    state.energy=Math.max(
      0,
      state.energy-.002
    );
  }

  const player=document.getElementById("player");

  player.style.left=state.x+"px";
  player.style.top=state.y+"px";

  cameraFollow();

  requestAnimationFrame(movePlayer);
}

function cameraFollow(){

  const world=document.getElementById("world");

  const screenW=innerWidth;
  const screenH=innerHeight;

  let left=
    screenW/2-state.x-35;

  let top=
    screenH/2-state.y-70;

  left=Math.min(0,Math.max(screenW-3000,left));
  top=Math.min(0,Math.max(screenH-2200,top));

  world.style.transform=
    `translate(${left}px,${top}px)`;
}

document.addEventListener("keydown",e=>{

  if(e.key==="ArrowUp"||e.key==="w")
    keys.up=true;

  if(e.key==="ArrowDown"||e.key==="s")
    keys.down=true;

  if(e.key==="ArrowLeft"||e.key==="a")
    keys.left=true;

  if(e.key==="ArrowRight"||e.key==="d")
    keys.right=true;
});

document.addEventListener("keyup",e=>{

  if(e.key==="ArrowUp"||e.key==="w")
    keys.up=false;

  if(e.key==="ArrowDown"||e.key==="s")
    keys.down=false;

  if(e.key==="ArrowLeft"||e.key==="a")
    keys.left=false;

  if(e.key==="ArrowRight"||e.key==="d")
    keys.right=false;
});

/* =========================
   MOBILE JOYSTICK
========================= */

const joystickEl=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickMove(e){

  const rect=joystickEl.getBoundingClientRect();

  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  let x=e.clientX-cx;
  let y=e.clientY-cy;

  const max=40;

  const dist=Math.hypot(x,y);

  if(dist>max){
    x=x/dist*max;
    y=y/dist*max;
  }

  stick.style.left=
    (35+x)+"px";

  stick.style.top=
    (35+y)+"px";

  joystick.x=x/max;
  joystick.y=y/max;
}

joystickEl.addEventListener("pointerdown",e=>{
  joystick.active=true;
  joystickEl.setPointerCapture(e.pointerId);
  joystickMove(e);
});

joystickEl.addEventListener("pointermove",e=>{
  if(joystick.active)joystickMove(e);
});

function resetJoystick(){

  joystick.active=false;
  joystick.x=0;
  joystick.y=0;

  stick.style.left="35px";
  stick.style.top="35px";
}

joystickEl.addEventListener("pointerup",resetJoystick);
joystickEl.addEventListener("pointercancel",resetJoystick);

/* =========================
   NPC MOVEMENT
========================= */

const npcData=[
  {
    id:"npc1",
    x:500,
    y:500,
    dx:0,
    dy:0
  },
  {
    id:"npc2",
    x:1250,
    y:500,
    dx:0,
    dy:0
  },
  {
    id:"npc3",
    x:1850,
    y:1150,
    dx:0,
    dy:0
  }
];

function moveNPCs(){

  npcData.forEach(n=>{

    if(Math.random()<.025){

      n.dx=
        Math.random()-.5;

      n.dy=
        Math.random()-.5;
    }

    n.x+=n.dx*.7;
    n.y+=n.dy*.7;

    n.x=Math.max(50,Math.min(2900,n.x));
    n.y=Math.max(50,Math.min(2100,n.y));

    const el=document.getElementById(n.id);

    if(el){
      el.style.left=n.x+"px";
      el.style.top=n.y+"px";
    }
  });

  setTimeout(moveNPCs,50);
}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
