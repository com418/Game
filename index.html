<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Naija Life — City Hustle</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#101512;color:#fff}
button{font:inherit;border:0;color:#fff;cursor:pointer}
svg{display:block}

#menu{
 position:fixed;inset:0;z-index:100;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 20%,#176047,#06100c 70%);
 padding:20px
}
.menuBox{width:min(440px,100%);text-align:center}
.logo{
 width:82px;height:82px;margin:auto;border-radius:24px;
 display:grid;place-items:center;background:#0b7a50;
 box-shadow:0 15px 40px #0008
}
.logo svg{width:56px;height:56px}
h1{font-size:36px;margin:18px 0 5px}
.subtitle{color:#b7c8c1;margin-bottom:28px}
.cityGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.city{
 padding:20px 12px;border-radius:20px;background:#ffffff10;
 border:1px solid #ffffff20;backdrop-filter:blur(10px)
}
.city:active{transform:scale(.97)}
.cityIcon{
 width:55px;height:55px;margin:auto;border-radius:18px;
 background:#ffffff12;display:grid;place-items:center
}
.cityIcon svg{width:34px;height:34px}
.city h2{margin:12px 0 5px;font-size:20px}
.city p{margin:0;color:#aebcb7;font-size:12px}
#startBtn{
 width:100%;margin-top:18px;padding:16px;border-radius:16px;
 background:#10a66b;font-size:16px;opacity:.45;pointer-events:none
}

#game{display:none;position:fixed;inset:0;overflow:hidden;background:#76a86c}
#world{
 position:absolute;width:3000px;height:2200px;left:0;top:0;
 transform-origin:0 0;background:#76a86c
}

.road{position:absolute;background:#34383b}
.horizontal{height:120px;width:3000px}
.vertical{width:120px;height:2200px}
.roadLineH{position:absolute;height:5px;width:3000px;background:#e8d66a}
.roadLineV{position:absolute;width:5px;height:2200px;background:#e8d66a}

.building{
 position:absolute;border-radius:12px;border:4px solid #ffffff18;
 box-shadow:0 10px 20px #0003;display:flex;align-items:center;
 justify-content:center;text-align:center;font-weight:800;
 color:#ffffffdd;font-size:13px
}
.house{background:#bd6b4d}
.shop{background:#286f91}
.office{background:#5c5b87}
.market{background:#8b633e}
.hotel{background:#76518d}
.job{background:#177d60}

#player{
 position:absolute;width:62px;height:82px;z-index:25;
 transform:translate(-50%,-50%)
}
#player svg{width:100%;height:100%;filter:drop-shadow(0 8px 5px #0005)}

.npc{
 position:absolute;width:50px;height:68px;z-index:15;
 transform:translate(-50%,-50%);
 transition:left .35s linear,top .35s linear
}
.npc svg{width:100%;height:100%;filter:drop-shadow(0 6px 4px #0004)}

#hud{
 position:fixed;top:0;left:0;right:0;z-index:40;
 padding:10px;pointer-events:none
}
.hudTop{display:flex;justify-content:space-between;gap:6px}
.hudCard{
 min-width:70px;background:#07110ddd;border:1px solid #ffffff18;
 border-radius:13px;padding:7px 10px;backdrop-filter:blur(10px);
 font-size:10px
}
.hudCard strong{display:block;font-size:13px;margin-top:2px}
#cityName{color:#64e6ad}
#xpBox{position:fixed;top:65px;left:10px;width:180px}
.xpOuter{height:7px;background:#ffffff25;border-radius:99px;overflow:hidden}
#xpBar{height:100%;width:0;background:#63e6ac}

.controlsTop{
 position:fixed;top:78px;right:10px;z-index:50;
 display:flex;gap:7px
}
.smallBtn{
 width:42px;height:42px;border-radius:13px;background:#07110ddd;
 border:1px solid #ffffff20;display:grid;place-items:center
}
.smallBtn svg{width:21px;height:21px}

#joystick{
 position:fixed;bottom:24px;left:24px;width:145px;height:145px;
 border-radius:50%;background:#07110d88;border:2px solid #ffffff22;
 z-index:60;touch-action:none
}
#stick{
 position:absolute;width:65px;height:65px;left:40px;top:40px;
 border-radius:50%;background:#10a66b;box-shadow:0 8px 20px #0006
}

.actionButtons{
 position:fixed;bottom:26px;right:24px;z-index:60;
 display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;
 width:180px
}
.action{
 width:56px;height:56px;border-radius:50%;
 background:#07110ddd;border:1px solid #ffffff25;
 display:grid;place-items:center
}
.action svg{width:25px;height:25px}

#notice{
 position:fixed;left:50%;top:128px;transform:translateX(-50%);
 z-index:90;background:#07110eef;padding:11px 17px;
 border-radius:13px;opacity:0;transition:.25s;pointer-events:none;
 font-size:13px;white-space:nowrap
}
#notice.show{opacity:1}

#panel{
 position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);
 width:min(440px,94%);z-index:85;
 background:#08120fef;border:1px solid #ffffff1f;
 border-radius:22px 22px 0 0;padding:18px;
 box-shadow:0 -15px 40px #0006;
 transition:.25s
}
#panel.open{transform:translate(-50%,0)}
.panelTitle{font-size:19px;font-weight:800;margin-bottom:5px}
.panelText{font-size:12px;color:#b8c7c2;line-height:1.5}
.panelButtons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.panelBtn{padding:13px;border-radius:12px;background:#10a66b}
.panelBtn.alt{background:#ffffff12}
.closePanel{position:absolute;right:14px;top:12px;background:none}

#mission{
 position:fixed;top:112px;left:10px;z-index:40;
 width:205px;background:#07110ddd;border:1px solid #ffffff18;
 border-radius:13px;padding:10px;backdrop-filter:blur(10px)
}
.mTitle{font-size:11px;color:#64e6ad;font-weight:800}
#mText{font-size:12px;margin-top:4px}
#missionReward{font-size:10px;color:#aebcb7;margin-top:5px}

@media(max-width:500px){
 .hudCard{padding:7px 7px;min-width:61px}
 #mission{top:128px;width:190px}
}
</style>
</head>

<script>
/* =========================
   STATE
========================= */

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const world=document.getElementById("world");
const player=document.getElementById("player");
const startBtn=document.getElementById("startBtn");
const cityName=document.getElementById("cityName");
const notice=document.getElementById("notice");

let selectedCity=null;

let state={
 city:"Lagos",
 x:500,
 y:450,
 money:5000,
 energy:100,
 level:1,
 xp:0,
 night:false,
 missionDone:false,
 transport:false
};


/* =========================
   CITY
========================= */

document.querySelectorAll(".city").forEach(btn=>{
 btn.addEventListener("click",()=>{
  selectedCity=btn.dataset.city;

  document.querySelectorAll(".city").forEach(c=>{
   c.style.borderColor="#ffffff20";
  });

  btn.style.borderColor="#10a66b";

  startBtn.style.opacity="1";
  startBtn.style.pointerEvents="auto";
 });
});

startBtn.addEventListener("click",()=>{
 const saved=localStorage.getItem("naijaLifeSave");

 if(saved){
  try{
   const old=JSON.parse(saved);
   state={...state,...old};
  }catch(e){}
 }

 state.city=selectedCity||"Lagos";

 cityName.textContent=state.city.toUpperCase();

 menu.style.display="none";
 game.style.display="block";

 applyNight();
 updateHUD();
 updateCamera();

 showNotice("Welcome to "+state.city);

 startNPCs();
});


/* =========================
   MOVEMENT
========================= */

let keys={
 up:false,down:false,left:false,right:false
};

let joystickX=0;
let joystickY=0;
let speed=3.5;

function movePlayer(){

 let dx=0,dy=0;

 if(keys.up)dy-=1;
 if(keys.down)dy+=1;
 if(keys.left)dx-=1;
 if(keys.right)dx+=1;

 dx+=joystickX;
 dy+=joystickY;

 if(dx||dy){

  const len=Math.sqrt(dx*dx+dy*dy);

  if(len>1){
   dx/=len;
   dy/=len;
  }

  const actualSpeed=state.transport?6:3.5;

  state.x+=dx*actualSpeed;
  state.y+=dy*actualSpeed;

  state.x=Math.max(35,Math.min(2965,state.x));
  state.y=Math.max(45,Math.min(2155,state.y));

  if(!state.transport){
   state.energy=Math.max(0,state.energy-.004);
  }

  updateHUD();
  updateCamera();
 }

 requestAnimationFrame(movePlayer);
}

movePlayer();


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")keys.up=true;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.down=true;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")keys.up=false;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.down=false;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;
});


/* =========================
   JOYSTICK
========================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickActive=false;

function joystickMove(x,y){

 const rect=joystick.getBoundingClientRect();

 let px=x-(rect.left+rect.width/2);
 let py=y-(rect.top+rect.height/2);

 const max=40;
 const distance=Math.sqrt(px*px+py*py);

 if(distance>max){
  px=px/distance*max;
  py=py/distance*max;
 }

 stick.style.transform=`translate(${px}px,${py}px)`;

 joystickX=px/max;
 joystickY=py/max;
}

function joystickReset(){

 joystickActive=false;
 stick.style.transform="translate(0,0)";
 joystickX=0;
 joystickY=0;
}

joystick.addEventListener("pointerdown",e=>{
 joystickActive=true;
 joystick.setPointerCapture(e.pointerId);
 joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{
 if(joystickActive)joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointerup",joystickReset);
joystick.addEventListener("pointercancel",joystickReset);


/* =========================
   CAMERA
========================= */

function updateCamera(){

 const sw=innerWidth;
 const sh=innerHeight;

 let cx=state.x-sw/2;
 let cy=state.y-sh/2;

 cx=Math.max(0,Math.min(3000-sw,cx));
 cy=Math.max(0,Math.min(2200-sh,cy));

 world.style.transform=
  `translate(${-cx}px,${-cy}px)`;

 player.style.left=state.x+"px";
 player.style.top=state.y+"px";
}

addEventListener("resize",updateCamera);


/* =========================
   XP
========================= */

function addXP(amount){

 state.xp+=amount;

 while(state.xp>=100){
  state.xp-=100;
  state.level++;
  showNotice("Level "+state.level+" reached!");
 }

 updateHUD();
}

function updateHUD(){

 cityName.textContent=state.city.toUpperCase();

 document.getElementById("money").textContent=
  "₦"+Math.floor(state.money).toLocaleString();

 document.getElementById("energy").textContent=
  Math.floor(state.energy)+"%";

 document.getElementById("level").textContent=
  state.level;

 document.getElementById("xpText").textContent=
  state.xp+" / 100";

 document.getElementById("xpBar").style.width=
  state.xp+"%";
}


/* =========================
   PANEL
========================= */

const panel=document.getElementById("panel");
const panelTitle=document.getElementById("panelTitle");
const panelText=document.getElementById("panelText");
const panelMain=document.getElementById("panelMain");

function openPanel(title,text,mainText,callback){

 panelTitle.textContent=title;
 panelText.textContent=text;
 panelMain.textContent=mainText;

 panel.classList.add("open");

 panelMain.onclick=()=>{
  callback?.();
 };
}

function closePanel(){
 panel.classList.remove("open");
}

document.getElementById("closePanel").onclick=closePanel;
document.getElementById("panelAlt").onclick=closePanel;


/* =========================
   INTERACTION
========================= */

document.getElementById("interactBtn").onclick=()=>{

 const target=findNearestBuilding();

 if(!target){
  showNotice("Move closer to a building.");
  return;
 }

 const name=target.textContent.trim();

 if(name==="BANK"){
  openPanel(
   "Bank",
   "Manage your in-game money and prepare for future upgrades.",
   "Check Balance",
   ()=>{
    showNotice("Balance: ₦"+state.money.toLocaleString());
   }
  );
  return;
 }

 if(name==="SUPERMARKET"||name==="SHOP"){
  openPanel(
   "Shop",
   "Buy food to restore energy.",
   "Buy Food — ₦200",
   ()=>{
    if(state.money<200){
     showNotice("Not enough money.");
     return;
    }

    state.money-=200;
    state.energy=Math.min(100,state.energy+25);

    updateHUD();
    addXP(5);

    showNotice("Food purchased.");
    closePanel();
   }
  );
  return;
 }

 if(name==="RESTAURANT"){
  openPanel(
   "Restaurant",
   "Take a meal and restore some energy.",
   "Eat — ₦300",
   ()=>{
    if(state.money<300){
     showNotice("Not enough money.");
     return;
    }

    state.money-=300;
    state.energy=Math.min(100,state.energy+40);

    updateHUD();
    addXP(8);

    showNotice("Energy restored.");
    closePanel();
   }
  );
  return;
 }

 if(name==="DELIVERY JOB"){
  startJob();
  return;
 }

 openPanel(
  name,
  "This location is part of the city. More features will be added in the next update.",
  "Explore",
  ()=>{
   showNotice("Location discovered.");
   addXP(3);
   closePanel();
  }
 );
};


/* =========================
   FIND NEAREST BUILDING
========================= */

function findNearestBuilding(){

 const buildings=[...document.querySelectorAll(".building")];

 let closest=null;
 let best=Infinity;

 buildings.forEach(b=>{

  const x=parseFloat(b.style.left)+
   parseFloat(b.style.width)/2;

  const y=parseFloat(b.style.top)+
   parseFloat(b.style.height)/2;

  const d=Math.hypot(state.x-x,state.y-y);

  if(d<best){
   best=d;
   closest=b;
  }
 });

 return best<230?closest:null;
}


/* =========================
   JOB SYSTEM
========================= */

function startJob(){

 openPanel(
  "Delivery Job",
  "Complete a delivery around the city. Your reward is paid in game currency.",
  "Start Job",
  ()=>{

   if(state.energy<20){
    showNotice("You need at least 20% energy.");
    return;
   }

   closePanel();

   state.energy-=20;

   showNotice("Delivery started!");

   document.getElementById("mText").textContent=
    "Complete the delivery.";

   setTimeout(()=>{

    state.money+=1000;
    addXP(25);

    state.missionDone=true;

    document.getElementById("mText").textContent=
     "Mission completed! Find another job.";

    document.getElementById("missionReward").textContent=
     "Reward received: ₦1,000 + 25 XP";

    showNotice("Job completed +₦1,000");

    updateHUD();

   },5000);
  }
);


/* job button */
document.getElementById("jobBtn").onclick=()=>{

 const target=findNearestBuilding();

 if(target && target.textContent.trim()==="DELIVERY JOB"){
  startJob();
 }else{
  showNotice("Find the Delivery Job building.");
 }
};


/* =========================
   FOOD BUTTON
========================= */

document.getElementById("foodBtn").onclick=()=>{

 if(state.energy>=100){
  showNotice("Your energy is already full.");
  return;
 }

 if(state.money<200){
  showNotice("You need ₦200 for food.");
  return;
 }

 state.money-=200;
 state.energy=Math.min(100,state.energy+25);

 addXP(5);
 updateHUD();

 showNotice("Food purchased.");
};


/* =========================
   TRANSPORT
========================= */

const car=document.getElementById("car");

car.addEventListener("click",()=>{

 const distance=Math.hypot(
  state.x-1097,
  state.y-605
 );

 if(distance>180){
  showNotice("Move closer to the vehicle.");
  return;
 }

 state.transport=!state.transport;

 if(state.transport){
  showNotice("Vehicle mode ON.");
  car.style.filter="brightness(1.25)";
 }else{
  showNotice("Vehicle mode OFF.");
  car.style.filter="none";
 }
});


/* =========================
   NPC MOVEMENT
========================= */

const npcs=[
 {el:document.getElementById("npc1"),x:620,y:400},
 {el:document.getElementById("npc2"),x:1250,y:900},
 {el:document.getElementById("npc3"),x:2050,y:1250}
];

function startNPCs(){

 npcs.forEach(npc=>{
  setInterval(()=>{

   npc.x+=
    (Math.random()-.5)*100;

   npc.y+=
    (Math.random()-.5)*100;

   npc.x=Math.max(80,Math.min(2920,npc.x));
   npc.y=Math.max(80,Math.min(2120,npc.y));

   npc.el.style.left=npc.x+"px";
   npc.el.style.top=npc.y+"px";

  },2500+Math.random()*1500);
 });
}


/* =========================
   NIGHT
========================= */

document.getElementById("nightBtn").onclick=()=>{

 state.night=!state.night;

 applyNight();

 showNotice(state.night?"Night mode":"Day mode");
};

function applyNight(){

 world.style.filter=
  state.night
   ?"brightness(.55) saturate(.8)"
   :"none";
}


/* =========================
   SAVE
========================= */

document.getElementById("saveBtn").onclick=saveGame;

function saveGame(){

 localStorage.setItem(
  "naijaLifeSave",
  JSON.stringify(state)
 );

 showNotice("Game saved.");
}

setInterval(saveGame,10000);


/* =========================
   NOTICE
========================= */

let noticeTimer;

function showNotice(message){

 notice.textContent=message;
 notice.classList.add("show");

 clearTimeout(noticeTimer);

 noticeTimer=setTimeout(()=>{
  notice.classList.remove("show");
 },2200);
}
</script>
